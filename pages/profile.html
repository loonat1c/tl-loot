<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль — TL Loot</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .profile-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .profile-layout { grid-template-columns: 1fr; } }
    
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s;
    }
    .player-card:hover { border-color: var(--accent); }
    .player-card .info .name { font-weight: 600; font-size: 1rem; }
    .player-card .info .details { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .player-card .status { font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 10px; }
    .player-card .status.approved { background: rgba(34,197,94,0.15); color: #22c55e; }
    .player-card .status.pending { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .player-card .status.rejected { background: rgba(239,68,68,0.15); color: #ef4444; }
    
    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-header h3 { font-size: 1.1rem; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; }
    .btn-close:hover { color: var(--text); }
    
    .flex { display: flex; }
    .gap-1 { gap: 0.5rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 1.5rem; }
    .text-danger { color: #ef4444; }
    .text-muted { color: var(--text-muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<nav class="navbar" id="main-nav"></nav>

<main class="container">
  <div class="page-header">
    <h2>👤 Профиль</h2>
    <button class="btn btn-primary hidden" data-role="moderator" id="btn-add-player">+ Добавить персонажа</button>
  </div>

  <div id="players-list">
    <div class="text-muted">Загрузка...</div>
  </div>
</main>

<!-- Модалка персонажа -->
<div class="modal-overlay hidden" id="modal-player">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Добавить персонажа</h3>
      <button class="btn-close" onclick="closeModal('modal-player')">✕</button>
    </div>
    <input type="hidden" id="edit-id" />

    <div class="form-group">
      <label>Никнейм *</label>
      <input type="text" id="f-nickname" placeholder="Введите никнейм персонажа" />
    </div>
    <div class="form-group">
      <label>Класс</label>
      <select id="f-class">
        <option value="">— выбери класс —</option>
        <option value="warrior">⚔️ Воин</option>
        <option value="mage">🔮 Маг</option>
        <option value="rogue">🗡️ Разбойник</option>
        <option value="ranger">🏹 Следопыт</option>
        <option value="healer">💚 Целитель</option>
        <option value="tank">🛡️ Танк</option>
      </select>
    </div>
    <div class="form-group">
      <label>Уровень</label>
      <input type="number" id="f-level" placeholder="1" min="1" max="99" />
    </div>

    <div id="modal-error" class="text-danger mt-1" style="display:none;font-size:0.85rem"></div>
    <div class="flex gap-1 mt-3">
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
      <button class="btn btn-ghost" onclick="closeModal('modal-player')">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { initAuth, authReady, currentUser, canWrite, isAdmin, currentRole } from "../js/modules/auth.js";
  
  initNavbar();
  initAuth((_u, _r) => {});
  await authReady;

  import { getPlayers, addPlayer, updatePlayer, deletePlayer } from "../js/modules/players.js";
  import { BOSS_CLASSES } from "../js/constants.js";

  let allPlayers = [];
  let editingId = null;

  // ============================================================
  // ЗАЩИТА: Проверка авторизации
  // ============================================================
  
  if (!currentUser) {
    window.location.href = '/pages/login.html';
    return;
  }

  // ============================================================
  // ЗАГРУЗКА ИГРОКОВ
  // ============================================================
  
  async function loadPlayers() {
    try {
      allPlayers = await getPlayers();
      renderPlayers();
    } catch (e) {
      console.error('Ошибка загрузки игроков:', e);
      document.getElementById('players-list').innerHTML = `<div class="text-danger">Ошибка загрузки</div>`;
    }
  }

  // ============================================================
  // ОТОБРАЖЕНИЕ ИГРОКОВ
  // ============================================================
  
  function renderPlayers() {
    const container = document.getElementById('players-list');
    const canEdit = canWrite();
    const admin = isAdmin();
    
    // Показываем только персонажей текущего пользователя (обычные пользователи)
    // Администратор видит всех
    let players = allPlayers;
    if (!admin) {
      players = allPlayers.filter(p => p.user_id === currentUser.uid);
    }
    
    if (!players.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div style="font-size:2rem">🎮</div>
          <div class="mt-1">У вас нет созданных персонажей</div>
          ${canEdit ? `<button class="btn btn-primary btn-sm mt-1" onclick="openAddPlayer()">+ Создать персонажа</button>` : ''}
        </div>
      `;
      return;
    }
    
    container.innerHTML = '';
    players.forEach(p => {
      const card = document.createElement('div');
      card.className = 'player-card';
      
      const statusClass = p.approved === true ? 'approved' : p.approved === false ? 'rejected' : 'pending';
      const statusText = p.approved === true ? 'Подтверждён' : p.approved === false ? 'Отклонён' : 'Ожидает';
      
      // Показываем кнопки только для своих персонажей или если админ
      const isOwn = p.user_id === currentUser.uid;
      const showActions = canEdit && (isOwn || admin);
      
      card.innerHTML = `
        <div class="info">
          <div class="name">${p.nickname || 'Без имени'}</div>
          <div class="details">
            ${p.class ? `${p.class}` : ''} ${p.level ? `· Ур. ${p.level}` : ''}
            <span class="status ${statusClass}">${statusText}</span>
          </div>
        </div>
        ${showActions ? `
          <div class="flex gap-1">
            <button class="btn btn-ghost btn-sm" onclick="openEditPlayer('${p.id}')">✏️</button>
            <button class="btn btn-danger btn-sm" onclick="confirmDelete('${p.id}','${p.nickname.replace(/'/g,"\\'")}')">🗑️</button>
          </div>
        ` : ''}
      `;
      container.appendChild(card);
    });
  }

  // ============================================================
  // МОДАЛКА
  // ============================================================
  
  function openAddPlayer() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Добавить персонажа';
    document.getElementById('edit-id').value = '';
    document.getElementById('f-nickname').value = '';
    document.getElementById('f-class').value = '';
    document.getElementById('f-level').value = '';
    document.getElementById('modal-error').style.display = 'none';
    openModal('modal-player');
  }
  
  window.openAddPlayer = openAddPlayer;

  window.openEditPlayer = (id) => {
    const p = allPlayers.find(x => x.id === id);
    if (!p) return;
    
    // Проверяем права на редактирование
    const isOwn = p.user_id === currentUser.uid;
    if (!isOwn && !isAdmin()) {
      showToast('У вас нет прав на редактирование этого персонажа', 'error');
      return;
    }
    
    editingId = id;
    document.getElementById('modal-title').textContent = 'Редактировать персонажа';
    document.getElementById('edit-id').value = id;
    document.getElementById('f-nickname').value = p.nickname || '';
    document.getElementById('f-class').value = p.class || '';
    document.getElementById('f-level').value = p.level || '';
    document.getElementById('modal-error').style.display = 'none';
    openModal('modal-player');
  };

  document.getElementById('btn-add-player').addEventListener('click', openAddPlayer);

  // ============================================================
  // СОХРАНЕНИЕ
  // ============================================================
  
  document.getElementById('btn-save').addEventListener('click', async () => {
    const nickname = document.getElementById('f-nickname').value.trim();
    const playerClass = document.getElementById('f-class').value;
    const level = document.getElementById('f-level').value.trim();
    const errEl = document.getElementById('modal-error');
    
    if (!nickname) {
      errEl.textContent = 'Введите никнейм';
      errEl.style.display = 'block';
      return;
    }
    
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Сохранение...';
    
    try {
      const isEdit = !!document.getElementById('edit-id').value;
      
      const data = {
        nickname,
        class: playerClass || null,
        level: level || null,
      };
      
      const id = document.getElementById('edit-id').value;
      if (id) {
        // При редактировании обновляем все поля, но user_id не меняем
        // И не меняем approved (если админ не редактирует)
        await updatePlayer(id, data);
        showToast('Персонаж обновлён');
      } else {
        // При создании проверяем: если админ - сразу approved: true
        const isAdminUser = isAdmin();
        
        await addPlayer({
          ...data,
          user_id: currentUser.uid,
          approved: isAdminUser, // Админы сразу одобрены!
          created_at: new Date().toISOString(),
        });
        showToast(isAdminUser ? 'Персонаж создан и подтверждён' : 'Персонаж создан, ожидает подтверждения');
      }
      
      closeModal('modal-player');
      await loadPlayers();
    } catch (e) {
      errEl.textContent = 'Ошибка: ' + e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Сохранить';
    }
  });

  // ============================================================
  // УДАЛЕНИЕ
  // ============================================================
  
  window.confirmDelete = (id, name) => {
    if (!confirm(`Удалить персонажа «${name}»?`)) return;
    deletePlayer(id)
      .then(() => {
        showToast('Персонаж удалён');
        loadPlayers();
      })
      .catch(e => {
        console.error('Ошибка удаления:', e);
        showToast('Ошибка удаления', 'error');
      });
  };

  // ============================================================
  // HELPERS
  // ============================================================
  
  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  window.closeModal = closeModal;

  function showToast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // ============================================================
  // ЗАЩИТА: Блокировка консоли
  // ============================================================
  
  document.addEventListener('contextmenu', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') {
      e.preventDefault();
      return false;
    }
  });

  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) ||
      (e.ctrlKey && e.key === 'u') ||
      (e.ctrlKey && e.key === 's')
    ) {
      e.preventDefault();
      return false;
    }
  });

  // ============================================================
  // ЗАПУСК
  // ============================================================
  
  loadPlayers();
</script>
</body>
</html>
