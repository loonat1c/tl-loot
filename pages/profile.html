<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль — TL Loot</title>

  <link rel="stylesheet" href="../css/main.css" />

  <style>
    .profile-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 2rem;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .profile-info h2 {
      font-size: 1.2rem;
      margin-bottom: 0.25rem;
    }

    .profile-info .email {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .profile-info .role {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(124, 58, 237, 0.2);
      color: var(--accent-soft);
      border: 1px solid var(--accent);
      margin-top: 0.25rem;
    }

    .characters-section {
      margin-top: 2rem;
    }

    .characters-section .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .characters-section .section-header h3 {
      font-size: 1.1rem;
    }

    .character-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
      position: relative;
    }

    .character-card:hover {
      border-color: var(--accent);
    }

    .character-card.pending {
      border-left: 3px solid var(--warning);
    }

    .character-card.approved {
      border-left: 3px solid var(--success);
    }

    .character-card.rejected {
      border-left: 3px solid var(--danger);
      opacity: 0.6;
    }

    .character-card .char-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .character-card .char-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .character-card .char-status {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .char-status.pending {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid var(--warning);
    }

    .char-status.approved {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .char-status.rejected {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .character-card .char-weapons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .character-card .char-weapons .weapon-tag {
      background: var(--bg-card2);
      padding: 0.15rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .character-card .char-loot {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .character-card .char-loot-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .character-card .char-loot-items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .character-card .char-loot-items .loot-tag {
      background: rgba(124, 58, 237, 0.15);
      padding: 0.15rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      border: 1px solid var(--accent);
      color: var(--accent-soft);
    }

    .character-card .char-moderation-note {
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: var(--bg-card2);
      border-radius: var(--radius);
      font-size: 0.8rem;
      color: var(--text-muted);
      border-left: 2px solid var(--warning);
    }

    .character-card .char-moderation-feedback {
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: var(--bg-card2);
      border-radius: var(--radius);
      font-size: 0.8rem;
      color: var(--text-muted);
      border-left: 2px solid var(--danger);
    }

    .char-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .modal .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .modal .form-row .form-group {
      margin-bottom: 0;
    }

    .weapon-select-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .weapon-select-group select {
      width: 100%;
    }

    .loot-selection {
      margin-top: 0.5rem;
    }

    .loot-selection .loot-slot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .loot-selection .loot-slot label {
      min-width: 80px;
      font-size: 0.8rem;
    }

    .loot-selection .loot-slot select {
      flex: 1;
    }

    .moderation-note {
      margin-top: 0.5rem;
    }

    .moderation-note textarea {
      resize: vertical;
      min-height: 60px;
    }

    @media (max-width: 768px) {
      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .modal .form-row {
        grid-template-columns: 1fr;
      }

      .loot-selection .loot-slot {
        flex-direction: column;
        align-items: stretch;
      }

      .loot-selection .loot-slot label {
        min-width: auto;
      }

      .character-card .char-header {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<nav class="navbar" id="main-nav"></nav>

<main class="container profile-container">

  <!-- ============================================
       ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ
  ============================================ -->

  <div class="profile-header" id="profile-header">
    <div class="profile-avatar" id="profile-avatar">👤</div>
    <div class="profile-info">
      <h2 id="profile-name">Загрузка...</h2>
      <div class="email" id="profile-email">—</div>
      <span class="role" id="profile-role">guest</span>
    </div>
  </div>

  <!-- ============================================
       ПЕРСОНАЖИ
  ============================================ -->

  <div class="characters-section">
    <div class="section-header">
      <h3>👥 Мой персонаж</h3>
      <button class="btn btn-primary btn-sm" id="btn-add-character">
        + Добавить персонажа
      </button>
    </div>

    <div id="characters-list">
      <div class="empty-state">
        <span class="icon">🎮</span>
        <p>У вас пока нет персонажа</p>
        <small>Создайте персонажа, чтобы участвовать в рейдах</small>
      </div>
    </div>
  </div>

</main>


<!-- ============================================
     МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ПЕРСОНАЖА
============================================ -->

<div class="modal-overlay hidden" id="modal-character">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-char-title">Добавить персонажа</h3>
      <button class="btn-close" id="btn-char-close">✕</button>
    </div>

    <input type="hidden" id="edit-char-id" />

    <!-- Имя персонажа -->
    <div class="form-group">
      <label>Имя персонажа *</label>
      <input type="text" id="f-char-name" placeholder="Имя в гильдии" />
    </div>

    <!-- Оружия -->
    <div class="form-group">
      <label>Оружие *</label>
      <div class="weapon-select-group">
        <select id="f-char-weapon1">
          <option value="">— выбери основное оружие —</option>
        </select>
        <select id="f-char-weapon2">
          <option value="">— выбери дополнительное оружие —</option>
        </select>
      </div>
    </div>

    <!-- Желаемый лут -->
    <div class="form-group">
      <label>Желаемый лут</label>
      <div class="loot-selection" id="loot-selection">
        <!-- Слоты будут добавлены через JS -->
      </div>
    </div>

    <!-- Сообщение для модерации -->
    <div class="form-group moderation-note">
      <label>Сообщение модератору (опционально)</label>
      <textarea id="f-moderation-note" placeholder="Дополнительная информация для модерации..." rows="2"></textarea>
    </div>

    <!-- Ошибка -->
    <div id="char-error" class="text-danger mt-1" style="display:none; font-size:0.85rem;"></div>

    <!-- Кнопки -->
    <div class="flex gap-1 mt-3">
      <button class="btn btn-primary" id="btn-char-save">Отправить на модерацию</button>
      <button class="btn btn-ghost" id="btn-char-cancel">Отмена</button>
    </div>
  </div>
</div>


<!-- ============================================
     JAVASCRIPT
============================================ -->

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { 
    initAuth, 
    authReady, 
    currentUser, 
    currentRole
  } from "../js/modules/auth.js";
  import { getItems } from "../js/modules/items.js";
  import { WEAPONS, SLOTS } from "../js/constants.js";
  import { 
    collection, 
    doc, 
    getDocs, 
    addDoc, 
    updateDoc, 
    deleteDoc,
    query,
    where,
    limit
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { db } from "../js/firebase.js";

  // ============================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================

  initNavbar();
  initAuth();
  await authReady;

  // Если не авторизован — перенаправить на вход
  if (!currentUser) {
    window.location.href = '/pages/login.html';
  }

  // ============================================
  // СОСТОЯНИЕ
  // ============================================

  let allItems = [];
  let characters = [];
  let editingCharId = null;
  const userId = currentUser?.uid;

  // ============================================
  // ЗАГРУЗКА ДАННЫХ
  // ============================================

  async function loadData() {
    try {
      allItems = await getItems();
      await loadCharacters();
      renderProfile();
      renderCharacters();
      populateWeaponSelects();
      populateLootSelects();
    } catch (error) {
      console.error('Ошибка загрузки данных:', error);
    }
  }

  async function loadCharacters() {
    try {
      const charsRef = collection(db, 'characters');
      const q = query(
        charsRef,
        where('user_id', '==', userId)
      );
      const querySnapshot = await getDocs(q);
      characters = querySnapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      // Сортируем вручную
      characters.sort((a, b) => {
        const dateA = a.created_at ? new Date(a.created_at) : new Date(0);
        const dateB = b.created_at ? new Date(b.created_at) : new Date(0);
        return dateB - dateA;
      });
    } catch (error) {
      console.error('Ошибка загрузки персонажей:', error);
      characters = [];
    }
  }

  // ============================================
  // ОТОБРАЖЕНИЕ ПРОФИЛЯ
  // ============================================

  function renderProfile() {
    const name = currentUser?.displayName || currentUser?.email?.split('@')[0] || 'Пользователь';
    document.getElementById('profile-name').textContent = name;
    document.getElementById('profile-email').textContent = currentUser?.email || '—';
    document.getElementById('profile-role').textContent = currentRole || 'guest';

    const avatar = document.getElementById('profile-avatar');
    avatar.textContent = name.charAt(0).toUpperCase();
  }

  // ============================================
  // ОТОБРАЖЕНИЕ ПЕРСОНАЖЕЙ
  // ============================================

  function renderCharacters() {
    const container = document.getElementById('characters-list');
    const addBtn = document.getElementById('btn-add-character');

    // Показываем/скрываем кнопку добавления
    if (addBtn) {
      if (characters.length > 0) {
        addBtn.style.display = 'none';
      } else {
        addBtn.style.display = 'inline-flex';
      }
    }

    if (!characters.length) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="icon">🎮</span>
          <p>У вас пока нет персонажа</p>
          <small>Создайте персонажа, чтобы участвовать в рейдах</small>
        </div>
      `;
      return;
    }

    container.innerHTML = characters.map(char => {
      const statusClass = char.status || 'pending';
      const statusLabel = {
        'pending': '⏳ На модерации',
        'approved': '✅ Одобрен',
        'rejected': '❌ Отклонён'
      }[statusClass] || '⏳ На модерации';

      const canEdit = statusClass === 'pending' || statusClass === 'rejected';
      const canDelete = statusClass === 'pending' || statusClass === 'rejected';

      return `
        <div class="character-card ${statusClass}">
          <div class="char-header">
            <div>
              <span class="char-name">${char.name}</span>
              <span class="char-status ${statusClass}">${statusLabel}</span>
            </div>
            <div class="char-actions">
              ${canEdit ? `<button class="btn btn-ghost btn-sm" onclick="window.editCharacter('${char.id}')">✏️</button>` : ''}
              ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="window.deleteCharacter('${char.id}')">🗑️</button>` : ''}
            </div>
          </div>

          <div class="char-weapons">
            ${char.weapons?.map(w => {
              const weapon = WEAPONS.find(wp => wp.id === w);
              return `<span class="weapon-tag">${weapon?.label || w}</span>`;
            }).join('') || '<span class="weapon-tag">Нет оружия</span>'}
          </div>

          ${char.desired_loot && Object.keys(char.desired_loot).length > 0 ? `
            <div class="char-loot">
              <div class="char-loot-label">🎯 Желаемый лут:</div>
              <div class="char-loot-items">
                ${Object.entries(char.desired_loot)
                  .filter(([_, itemId]) => itemId)
                  .map(([slot, itemId]) => {
                    const item = allItems.find(i => i.id === itemId);
                    const slotObj = SLOTS.find(s => s.id === slot);
                    const slotLabel = slotObj?.label || slot;
                    return item ? `
                      <span class="loot-tag">${slotLabel}: ${item.name}</span>
                    ` : '';
                  })
                  .join('')}
              </div>
            </div>
          ` : ''}

          ${char.moderation_note ? `
            <div class="char-moderation-note">
              💬 ${char.moderation_note}
            </div>
          ` : ''}

          ${char.moderation_feedback ? `
            <div class="char-moderation-feedback">
              📝 Ответ модератора: ${char.moderation_feedback}
            </div>
          ` : ''}
        </div>
      `;
    }).join('');

    // Навешиваем обработчики через window
    window.editCharacter = (id) => {
      const char = characters.find(c => c.id === id);
      if (char) openEditCharacter(char);
    };

    window.deleteCharacter = async (id) => {
      if (confirm('Удалить персонажа?')) {
        try {
          await deleteDoc(doc(db, 'characters', id));
          characters = characters.filter(c => c.id !== id);
          renderCharacters();
          showToast('Персонаж удалён');
        } catch (error) {
          console.error('Ошибка удаления:', error);
          showToast('Ошибка удаления', 'error');
        }
      }
    };
  }

  // ============================================
  // ЗАПОЛНЕНИЕ SELECT ОРУЖИЙ
  // ============================================

  function populateWeaponSelects() {
    const selects = ['f-char-weapon1', 'f-char-weapon2'];
    
    selects.forEach(selectId => {
      const select = document.getElementById(selectId);
      if (!select) return;

      const currentValue = select.value;
      select.innerHTML = `<option value="">— выбери оружие —</option>`;

      WEAPONS.forEach(weapon => {
        const option = document.createElement('option');
        option.value = weapon.id;
        option.textContent = weapon.label;
        select.appendChild(option);
      });

      if (currentValue) {
        select.value = currentValue;
      }
    });
  }

  // ============================================
  // ЗАПОЛНЕНИЕ SELECT ЖЕЛАЕМОГО ЛУТА
  // ============================================

  function populateLootSelects() {
    const container = document.getElementById('loot-selection');
    if (!container) return;

    container.innerHTML = SLOTS.map(slot => {
      return `
        <div class="loot-slot">
          <label>${slot.label}</label>
          <select data-slot="${slot.id}">
            <option value="">— не выбрано —</option>
            ${allItems
              .filter(item => item.slot === slot.id)
              .map(item => `
                <option value="${item.id}">${item.name}</option>
              `).join('')}
          </select>
        </div>
      `;
    }).join('');
  }

  // ============================================
  // МОДАЛЬНОЕ ОКНО
  // ============================================

  const modal = document.getElementById('modal-character');
  const modalTitle = document.getElementById('modal-char-title');
  const editCharId = document.getElementById('edit-char-id');
  const charName = document.getElementById('f-char-name');
  const charWeapon1 = document.getElementById('f-char-weapon1');
  const charWeapon2 = document.getElementById('f-char-weapon2');
  const charModerationNote = document.getElementById('f-moderation-note');
  const charError = document.getElementById('char-error');

  function openAddCharacter() {
    // Проверяем, есть ли уже персонаж
    if (characters.length > 0) {
      showToast('У вас уже есть персонаж!', 'error');
      return;
    }

    modalTitle.textContent = 'Добавить персонажа';
    editCharId.value = '';
    charName.value = '';
    charWeapon1.value = '';
    charWeapon2.value = '';
    charModerationNote.value = '';
    
    document.querySelectorAll('#loot-selection select').forEach(select => {
      select.value = '';
    });

    charError.style.display = 'none';
    modal.classList.remove('hidden');
  }

  function openEditCharacter(char) {
    modalTitle.textContent = 'Редактировать персонажа';
    editCharId.value = char.id;
    charName.value = char.name || '';
    charWeapon1.value = char.weapons?.[0] || '';
    charWeapon2.value = char.weapons?.[1] || '';
    charModerationNote.value = char.moderation_note || '';

    if (char.desired_loot) {
      document.querySelectorAll('#loot-selection select').forEach(select => {
        const slot = select.dataset.slot;
        select.value = char.desired_loot[slot] || '';
      });
    }

    charError.style.display = 'none';
    modal.classList.remove('hidden');
  }

  function closeCharModal() {
    modal.classList.add('hidden');
  }

  document.getElementById('btn-add-character').addEventListener('click', openAddCharacter);
  document.getElementById('btn-char-close').addEventListener('click', closeCharModal);
  document.getElementById('btn-char-cancel').addEventListener('click', closeCharModal);

  // ============================================
  // СОХРАНЕНИЕ ПЕРСОНАЖА
  // ============================================

  document.getElementById('btn-char-save').addEventListener('click', async () => {
    const name = charName.value.trim();
    const weapon1 = charWeapon1.value;
    const weapon2 = charWeapon2.value;
    const moderationNote = charModerationNote.value.trim();

    if (!name) {
      charError.textContent = 'Введите имя персонажа';
      charError.style.display = 'block';
      return;
    }

    if (!weapon1) {
      charError.textContent = 'Выберите основное оружие';
      charError.style.display = 'block';
      return;
    }

    // Проверяем, есть ли уже персонаж (защита от дублирования)
    if (!editCharId.value && characters.length > 0) {
      charError.textContent = 'У вас уже есть персонаж!';
      charError.style.display = 'block';
      return;
    }

    const desiredLoot = {};
    document.querySelectorAll('#loot-selection select').forEach(select => {
      const slot = select.dataset.slot;
      const value = select.value;
      if (value) {
        desiredLoot[slot] = value;
      }
    });

    const charData = {
      name,
      weapons: [weapon1, weapon2].filter(Boolean),
      desired_loot: desiredLoot,
      user_id: userId,
      user_email: currentUser?.email,
      status: 'pending',
      moderation_note: moderationNote || null,
      moderation_feedback: null,
      moderated_by: null,
      moderated_at: null,
      updated_at: new Date().toISOString()
    };

    const id = editCharId.value;

    try {
      if (id) {
        const existing = characters.find(c => c.id === id);
        if (existing && existing.status === 'approved') {
          charError.textContent = 'Нельзя редактировать одобренного персонажа';
          charError.style.display = 'block';
          return;
        }
        await updateDoc(doc(db, 'characters', id), charData);
        showToast('Персонаж обновлён и отправлен на модерацию');
      } else {
        await addDoc(collection(db, 'characters'), {
          ...charData,
          created_at: new Date().toISOString()
        });
        showToast('Персонаж отправлен на модерацию!');
      }

      closeCharModal();
      await loadCharacters();
      renderCharacters();

    } catch (error) {
      console.error('Ошибка сохранения:', error);
      charError.textContent = 'Ошибка сохранения: ' + error.message;
      charError.style.display = 'block';
    }
  });

  // ============================================
  // HELPERS
  // ============================================

  function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // ============================================
  // ЗАГРУЗКА ДАННЫХ
  // ============================================

  await loadData();

  console.log('✅ Страница профиля загружена');

</script>
