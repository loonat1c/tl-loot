        iconWrap.addEventListener('click', () => openSlotPicker(slotDef, null, pendingLoot, {}, (newItemId) => {
          pendingLoot[slotDef.id] = newItemId;
          refresh();
          updateDerivedWeaponsDraft();
          if (activeSlotId === slotDef.id) {
            const newItem = newItemId ? allItems.find(i => i.id === newItemId) : null;
            if (newItem) { cardEl.className = 'clb-item-card'; cardEl.innerHTML = buildItemCardHtml(newItem, false, slotDef.label); }
            else { cardEl.className = 'clb-item-card empty-card'; cardEl.innerHTML = emptyCardHtml; }
          }
        }));
      }

      refresh();
      cell._refresh = refresh;
      return cell;
    }

    LOOT_SLOTS_LEFT.forEach(s => colLeft.appendChild(buildDraftCell(s)));
    LOOT_SLOTS_RIGHT.forEach(s => rightCol.appendChild(buildDraftCell(s)));

    // Footer — moderation note + actions, so it's crystal clear what's sent
    const editNoteEl = document.createElement('div');
    editNoteEl.className = 'clb-edit-note';
    editNoteEl.innerHTML = `
      <label>Сообщение модератору (необязательно)</label>
      <textarea id="draft-mod-note" placeholder="Например: играю на арбалетах, ранее состоял в..." rows="2"></textarea>
    `;
    block.appendChild(editNoteEl);

    const footer = document.createElement('div');
    footer.className = 'clb-footer';
    const note = document.createElement('span');
    note.className = 'clb-footer-note';
    note.textContent = 'Имя и выбранный лут уйдут на модерацию';
    const actions = document.createElement('div');
    actions.className = 'clb-footer-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost btn-sm';
    cancelBtn.textContent = 'Отмена';
    cancelBtn.addEventListener('click', () => {
      if (addBtnEl) addBtnEl.style.display = '';
      renderCharacters();
    });
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn btn-primary btn-sm';
    saveBtn.textContent = userIsModerator ? 'Создать персонажа' : 'Отправить на модерацию';
    saveBtn.addEventListener('click', () => submitDraftCharacter(saveBtn, pendingLoot));
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    footer.appendChild(note);
    footer.appendChild(actions);
    block.appendChild(footer);

    list.appendChild(block);
    document.getElementById('draft-char-name').focus();
  }

  async function submitDraftCharacter(saveBtn, pendingLoot) {
    const nameInput = document.getElementById('draft-char-name');
    const name = nameInput.value.trim();
    if (!name) { showToast('Введите имя персонажа', 'error'); nameInput.focus(); return; }
    const note = document.getElementById('draft-mod-note').value.trim();

    const weaponTypes = [];
    ['weapon1', 'weapon2'].forEach(slot => {
      if (pendingLoot[slot]) {
        const item = allItems.find(i => i.id === pendingLoot[slot]);
        if (item?.weapon_type && !weaponTypes.includes(item.weapon_type)) weaponTypes.push(item.weapon_type);
      }
    });

    const data = {
      name,
      user_id: user.uid,
      user_email: user.email,
      status: userIsModerator ? 'approved' : 'pending',
      previous_status: null,
      edit_note: null,
      moderation_note: note || null,
      moderation_feedback: null,
      moderated_by: userIsModerator ? user.uid : null,
      moderated_at: userIsModerator ? new Date().toISOString() : null,
      updated_at: new Date().toISOString(),
      weapons: weaponTypes,
      desired_loot: pendingLoot,
      won_items: {},
      created_at: new Date().toISOString(),
    };

    saveBtn.disabled = true; saveBtn.textContent = 'Сохранение...';
    try {
      await addDoc(collection(db, 'characters'), data);
      showToast(userIsModerator ? 'Персонаж создан!' : 'Персонаж отправлен на модерацию!');
      const addBtnEl = document.getElementById('btn-add-character');
      if (addBtnEl) addBtnEl.style.display = '';
      await loadCharacters();
      renderCharacters();
    } catch (e) {
      showToast('Ошибка: ' + e.message, 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = userIsModerator ? 'Создать персонажа' : 'Отправить на модерацию';
    }
  }

  // ── Toast ─────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
  }

  // ── Run ───────────────────────────────────────────
  await loadData();
</script>

</body>
</html>
