<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль — TL Loot</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .profile-container { max-width: 1200px; margin: 0 auto; }

    /* ── Profile header ── */
    .profile-header {
      display: flex; align-items: center; gap: 1.5rem;
      padding: 1.75rem 2rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; margin-bottom: 2rem;
      position: relative; overflow: hidden;
    }
    .profile-header::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at top left, var(--accent-glow) 0%, transparent 60%);
      pointer-events: none;
    }
    .profile-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #4f2fcf);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff; flex-shrink: 0;
      box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 5px var(--accent);
      position: relative; z-index: 1;
    }
    .profile-info { position: relative; z-index: 1; flex: 1; }
    .profile-name-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; }
    .profile-info h2 { font-size: 1.3rem; font-weight: 700; margin: 0; color: var(--text); }
    .btn-edit-profile {
      background: var(--bg-card2); border: 1px solid var(--border);
      color: var(--text-muted); width: 32px; height: 32px;
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-edit-profile:hover { background: var(--accent-glow); color: var(--accent-soft); border-color: var(--accent); }
    .profile-info .username {
      color: var(--text-muted); font-size: 0.83rem; margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .profile-role {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      background: var(--accent-glow); color: var(--accent-soft); border: 1px solid var(--accent);
    }
    .edit-profile-form { display: none; margin-top: 0.75rem; padding: 1rem; background: var(--bg-card2); border-radius: 10px; border: 1px solid var(--border); }
    .edit-profile-form.active { display: block; }
    .edit-profile-form .form-group { margin-bottom: 0.75rem; }
    .edit-profile-form label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
    .edit-profile-form input { width: 100%; padding: 0.6rem 0.75rem; font-size: 0.9rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
    .edit-profile-form input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn-group { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-group .btn { flex: 1; padding: 0.5rem; font-size: 0.85rem; }

    /* ══════════════════════════════════════════════════
       CHARACTER LOOT BLOCK
    ══════════════════════════════════════════════════ */
    .char-loot-block {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; margin-bottom: 1.5rem;
    }
    .char-loot-block.pending  { border-left: 3px solid var(--warning); }
    .char-loot-block.approved { border-left: 3px solid var(--success); }
    .char-loot-block.rejected { border-left: 3px solid var(--danger); opacity: 0.72; }

    /* Header */
    .clb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; gap: 1rem; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .clb-header-left { display: flex; align-items: center; gap: 0.75rem; }
    .clb-char-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg-card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem; flex-shrink: 0;
    }
    .clb-char-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.25rem; }
    .clb-char-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .char-status {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
      border: 1px solid;
    }
    .char-status .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .char-status.pending  { background: rgba(245,158,11,0.12); color: var(--warning); border-color: rgba(245,158,11,0.35); }
    .char-status.approved { background: rgba(34,197,94,0.12);  color: var(--success); border-color: rgba(34,197,94,0.35); }
    .char-status.rejected { background: rgba(239,68,68,0.12);  color: var(--danger);  border-color: rgba(239,68,68,0.35); }
    .weapon-tag { background: var(--bg-card2); padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; border: 1px solid var(--border); }
    .clb-header-right { display: flex; align-items: center; gap: 0.75rem; }
    .clb-progress {
      font-size: 0.75rem; color: var(--text-muted);
      background: var(--bg-card2); padding: 0.25rem 0.75rem;
      border-radius: 20px; border: 1px solid var(--border);
    }
    .clb-progress span { color: var(--success); font-weight: 700; }
    .btn-loot-edit-top {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card2); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s; font-size: 0.85rem;
    }
    .btn-loot-edit-top:hover { border-color: var(--accent); background: var(--accent-glow); color: var(--accent-soft); }
    .draft-name-input {
      font-size: 1.05rem; font-weight: 700; color: var(--text); font-family: inherit;
      background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.35rem 0.6rem; margin-bottom: 0.35rem; width: 240px; max-width: 100%;
    }
    .draft-name-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
    .draft-name-input::placeholder { color: var(--text-muted); font-weight: 400; }

    /* ── Loot layout: slots + silhouette + card ── */
    .clb-body {
      display: grid;
      grid-template-columns: 280px 1fr 280px 380px;
      gap: 0 0.5rem;
      height: 640px;
      position: relative;
    }

    /* Columns */
    .loot-col {
      padding: 1.25rem 0.75rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      position: relative; z-index: 2;
      overflow-y: auto;
    }
    .loot-col-left  { align-items: flex-end; }
    .loot-col-right { align-items: flex-start; }

    /* Silhouette center — fixed frame so it never shifts with card height */
    .loot-silhouette {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      height: 100%;
    }
    .loot-silhouette img {
      position: absolute;
      height: 100%; max-height: 100%;
      width: auto; object-fit: contain;
      opacity: 0.35;
      filter: drop-shadow(0 0 40px rgba(124,58,237,0.2));
      pointer-events: none; user-select: none;
    }
    .loot-silhouette-placeholder {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 7rem; opacity: 0.05;
      pointer-events: none; user-select: none;
    }

    /* Slot cell */
    .loot-slot-cell {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.3rem 0.5rem; border-radius: 10px;
      transition: background 0.15s;
      max-width: 240px; width: 100%;
    }
    .loot-slot-cell.has-item { cursor: pointer; }
    .loot-slot-cell.has-item:hover { background: rgba(255,255,255,0.04); }
    .loot-slot-cell.active-slot { background: var(--accent-glow); }
    .loot-col-left .loot-slot-cell { flex-direction: row-reverse; }

    /* Slot icon — outer wrapper stays unclipped so the "obtained" badge can
       overflow its corner; the rounded/clipped visuals live on the inner box */
    .slot-cell-icon {
      width: 54px; height: 54px; flex-shrink: 0;
      position: relative;
      font-size: 1.4rem;
    }
    .slot-cell-icon-inner {
      position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
      background: var(--bg-card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .slot-cell-icon-inner img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
    .slot-cell-icon-inner.quality-epic { background: #1a0a2e; border-color: rgba(168,85,247,0.45); box-shadow: inset 0 0 10px rgba(168,85,247,0.12); }
    .slot-cell-icon-inner.quality-epic_ii { background: #1a0a2e; border-color: rgba(139,92,246,0.55); box-shadow: inset 0 0 14px rgba(139,92,246,0.18); }
    .slot-cell-icon-inner.quality-epic_ii::before {
      content: ''; position: absolute; inset: -40%;
      background: radial-gradient(ellipse at 60% 40%, rgba(180,80,255,0.55) 0%, transparent 65%),
                  radial-gradient(ellipse at 30% 70%, rgba(120,40,220,0.4) 0%, transparent 60%);
      animation: epic-fog 4s ease-in-out infinite alternate;
      z-index: 0; pointer-events: none;
    }
    @keyframes epic-fog {
      0%   { transform: translate(0%,0%)   scale(1);    opacity: 0.85; }
      33%  { transform: translate(8%,-5%)  scale(1.08); opacity: 1;    }
      66%  { transform: translate(-6%,8%)  scale(1.05); opacity: 0.9;  }
      100% { transform: translate(5%,5%)   scale(1.1);  opacity: 1;    }
    }
    .slot-cell-icon-inner.obtained {
      border-color: rgba(34,197,94,0.6) !important;
      box-shadow: 0 0 10px rgba(34,197,94,0.18), inset 0 0 6px rgba(34,197,94,0.08) !important;
    }
    .slot-cell-icon-inner.empty-slot { opacity: 0.2; border-style: dashed; font-size: 1.2rem; }
    .slot-cell-icon.editable-slot { cursor: pointer; }
    .slot-cell-icon.editable-slot:hover .slot-cell-icon-inner { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .slot-obtained-badge {
      position: absolute; top: -4px; right: -4px;
      width: 17px; height: 17px; background: #22c55e;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; color: #fff; font-weight: 700;
      z-index: 10; border: 2px solid var(--bg-card);
    }
    .slot-edit-hint {
      position: absolute; inset: 0;
      background: rgba(124,58,237,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; opacity: 0;
      transition: opacity 0.15s; z-index: 5; border-radius: 9px;
    }
    .slot-cell-icon.editable-slot:hover .slot-edit-hint { opacity: 1; }

    /* Slot text */
    .slot-cell-info { flex: 1; min-width: 0; }
    .slot-cell-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 0.15rem; }
    .slot-cell-name { font-size: 0.78rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .loot-col-left .slot-cell-name  { text-align: right; }
    .loot-col-left .slot-cell-label { text-align: right; }
    .slot-cell-name.epic-name    { color: #c4b5fd; }
    .slot-cell-name.epic2-name   { color: #a78bfa; }
    .slot-cell-name.empty-name   { color: var(--text-muted); font-style: italic; font-weight: 400; font-size: 0.72rem; }
    .slot-cell-name.obtained-name { color: #4ade80; }

    /* ── Item detail card (right panel) ── */
    .clb-item-card {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin: 1rem 1rem 1rem 0;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 0;
    }
    .clb-item-card.empty-card {
      align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.85rem; text-align: center;
    }

    .lic-obtained-banner {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25);
      border-radius: 8px; margin-bottom: 0.75rem;
      font-size: 0.78rem; color: #4ade80; font-weight: 600;
    }

    /* Top bar: icon + quality/level/type pills + wiki link */
    .lic-topbar { display: flex; align-items: flex-start; gap: 0.9rem; margin-bottom: 0.75rem; }
    .lic-img-wrap {
      width: 60px; height: 60px; border-radius: 10px; flex-shrink: 0;
      position: relative; overflow: hidden;
      background: #1a0a2e; border: 1px solid rgba(201,170,113,0.3);
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--text-muted);
    }
    .lic-img-wrap img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
    .lic-img-wrap.quality-epic    { border-color: rgba(168,85,247,0.4); }
    .lic-img-wrap.quality-epic_ii { border-color: rgba(139,92,246,0.5); }
    .lic-img-wrap.quality-epic_ii::before {
      content: ''; position: absolute; inset: -40%;
      background: radial-gradient(ellipse at 60% 40%, rgba(180,80,255,0.55) 0%, transparent 65%),
                  radial-gradient(ellipse at 30% 70%, rgba(120,40,220,0.4) 0%, transparent 60%);
      animation: epic-fog 4s ease-in-out infinite alternate; z-index: 0;
    }
    .lic-topbar-right { flex: 1; min-width: 0; }
    .lic-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-bottom: 0.4rem; }
    .lic-badge { font-size: 0.65rem; padding: 0.14rem 0.55rem; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    .lic-badge.qual  { color: #c4b5fd; background: rgba(168,85,247,0.12);  border: 1px solid rgba(168,85,247,0.28); }
    .lic-badge.level { color: #e2c98a; background: rgba(201,170,113,0.1); border: 1px solid rgba(201,170,113,0.25); }
    .lic-badge.slot  { color: var(--text-muted); background: var(--bg-card2); border: 1px solid var(--border); text-transform: none; font-weight: 600; }
    .lic-wiki-link {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.72rem; color: var(--accent-soft); text-decoration: none;
      border: 1px solid var(--border); border-radius: 6px; padding: 0.15rem 0.55rem;
      background: var(--bg-card2); margin-top: 0.15rem;
    }
    .lic-wiki-link:hover { border-color: var(--accent); }

    .lic-name { font-size: 0.98rem; font-weight: 700; color: #e2c98a; font-family: 'HeaderFont', var(--font); margin-bottom: 0.75rem; line-height: 1.3; }

    /* Damage / defense box */
    .lic-damage-box { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
    .lic-damage-cell {
      padding: 0.55rem 0.75rem; background: rgba(201,170,113,0.07);
      border: 1px solid rgba(201,170,113,0.18); border-radius: 8px;
    }
    .lic-damage-cell-label { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 0.15rem; }
    .lic-damage-cell-value { font-size: 1.1rem; font-weight: 700; color: #e2c98a; }

    /* Power / effect callout */
    .lic-effect { display: flex; gap: 0.6rem; padding: 0.55rem 0.65rem; background: rgba(168,85,247,0.06); border-radius: 8px; border: 1px solid rgba(168,85,247,0.18); margin-bottom: 0.6rem; }
    .lic-effect-icon { width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(168,85,247,0.15); color: #c4b5fd; font-size: 0.95rem; }
    .lic-effect img { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .lic-effect-name { font-size: 0.76rem; font-weight: 600; color: #c4b5fd; margin-bottom: 2px; }
    .lic-effect-desc { font-size: 0.73rem; color: var(--text-muted); line-height: 1.45; }

    /* Extended attribute list */
    .lic-stats { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.6rem; }
    .lic-stat { font-size: 0.82rem; display: flex; justify-content: space-between; gap: 0.4rem; padding: 0.1rem 0; }
    .lic-stat-label { color: var(--text-muted); }
    .lic-stat-value { color: var(--text); font-weight: 600; }

    .lic-section-title { font-size: 0.68rem; font-weight: 700; color: var(--text-faint, var(--text-muted)); text-transform: uppercase; letter-spacing: 0.5px; margin: 0.7rem 0 0.45rem; }

    /* Equipment properties (СВОЙСТВА СНАРЯЖЕНИЯ) */
    .lic-props-list { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.3rem; }
    .lic-prop-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; }
    .lic-prop-dot { color: var(--accent-soft); font-size: 0.6rem; }
    .lic-prop-label { flex: 1; color: var(--text); }
    .lic-prop-value { color: #e2c98a; font-weight: 700; }
    .lic-prop-lvl { font-size: 0.68rem; color: var(--text-muted); min-width: 32px; text-align: right; }
    .lic-props { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.2rem; }
    .lic-prop-tag { background: var(--bg-card); padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.65rem; border: 1px solid var(--border); color: var(--text-muted); }

    /* Set bonus */
    .lic-set-bonus { padding: 0.45rem 0.65rem; background: rgba(201,170,113,0.05); border-radius: 8px; border: 1px solid rgba(201,170,113,0.18); margin-bottom: 0.5rem; }
    .lic-set-name  { font-weight: 700; color: #c9aa71; font-size: 0.82rem; margin-bottom: 0.2rem; }
    .lic-set-piece { font-size: 0.73rem; color: var(--text-muted); }
    .lic-set-piece span { color: #8a6f3e; font-weight: 600; margin-right: 0.25rem; }

    /* Runes */
    .lic-rune-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border-soft, var(--border)); font-size: 0.82rem; }
    .lic-rune-row:last-child { border-bottom: none; }
    .lic-rune-icon { width: 26px; height: 26px; border-radius: 6px; background: var(--bg-card2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent-soft); font-size: 0.85rem; flex-shrink: 0; }
    .lic-rune-name { flex: 1; color: var(--text); font-weight: 600; }
    .lic-rune-tier { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 0.12rem 0.5rem; border-radius: 10px; background: rgba(168,85,247,0.12); color: #c4b5fd; border: 1px solid rgba(168,85,247,0.25); }

    .lic-flavor { margin-top: 0.45rem; padding-top: 0.45rem; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--text-muted); font-style: italic; line-height: 1.5; }
    .lic-boss { margin-top: 0.45rem; padding-top: 0.45rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0.45rem; font-size: 0.72rem; color: var(--text-muted); }
    .lic-boss img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(201,170,113,0.25); }

    /* Footer stat line (synergy / perception / shield pen) */
    .lic-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 0.75rem; padding-top: 0.65rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-muted); }
    .lic-footer-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 0.15rem 0.55rem; border-radius: 10px; background: var(--accent-glow); color: var(--accent-soft); border: 1px solid var(--accent); }

    /* ── Footer actions ── */
    .clb-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .clb-footer-note { font-size: 0.78rem; color: var(--text-muted); }
    .clb-footer-actions { display: flex; gap: 0.5rem; }

    /* ── Edit mode ── */
    .clb-edit-note {
      margin: 0 1.5rem 1rem;
      padding: 0.75rem 1rem;
      background: var(--bg-card2); border-radius: 10px; border: 1px solid var(--border);
    }
    .clb-edit-note label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
    .clb-edit-note textarea { width: 100%; padding: 0.5rem 0.7rem; font-size: 0.85rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); resize: vertical; min-height: 52px; }
    .clb-edit-note textarea:focus { border-color: var(--accent); outline: none; }

    /* ── Pending section (no loot yet) ── */
    .clb-pending-body {
      padding: 1.5rem;
    }
    .clb-info-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.75rem; background: var(--bg-card2);
      border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem;
    }
    .clb-info-block .label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; display: block; margin-bottom: 0.4rem; }
    .date-val { font-size: 0.85rem; color: var(--text-muted); }
    .char-moderation-note, .char-moderation-feedback {
      margin-top: 0.75rem; padding: 0.65rem 0.85rem;
      background: var(--bg-card2); border-radius: 8px; font-size: 0.83rem; color: var(--text-muted);
      display: flex; align-items: flex-start; gap: 0.5rem;
    }
    .char-moderation-note     { border-left: 3px solid var(--warning); }
    .char-moderation-feedback { border-left: 3px solid var(--danger); }

    /* ── Buttons ── */
    .btn-edit-char {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.75rem; border-radius: 7px; border: 1px solid var(--border);
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      background: var(--bg-card2); color: var(--text); transition: border-color 0.15s;
    }
    .btn-edit-char:hover { border-color: var(--accent); }
    .btn-edit-approved {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.75rem; border-radius: 7px; border: 1px solid var(--accent);
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      background: var(--accent-glow); color: var(--accent-soft); transition: all 0.15s;
    }
    .btn-edit-approved:hover { background: var(--accent); color: #fff; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 3rem 2rem; border: 1.5px dashed rgba(255,255,255,0.08); border-radius: 14px; color: var(--text-muted); }
    .empty-state .icon { font-size: 2.2rem; display: block; margin-bottom: 0.75rem; color: var(--text-muted); }
    .empty-state p { font-size: 0.95rem; color: var(--text); margin-bottom: 0.25rem; font-weight: 500; }

    /* ══════════════════════════════════════════════════
       MODAL — character edit
    ══════════════════════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      width: 100%; max-width: 480px; max-height: 92vh; overflow: hidden;
      display: flex; flex-direction: column;
      transform: scale(0.95) translateY(12px); transition: transform 0.25s ease;
      box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-accent-bar { height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-soft), transparent); flex-shrink: 0; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem 0; flex-shrink: 0; }
    .modal-header-left { display: flex; align-items: center; gap: 0.75rem; }
    .modal-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--accent-glow); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .modal-header h3 { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .modal-header .modal-subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; }
    .btn-close { background: var(--bg-card2); border: 1px solid var(--border); color: var(--text-muted); font-size: 1rem; cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
    .btn-close:hover { background: rgba(239,68,68,0.1); color: var(--danger); border-color: var(--danger); }
    .modal-body { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
    .field-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.3px; margin-bottom: 0.4rem; display: block; }
    .field-required { color: var(--accent-soft); margin-left: 2px; }
    .modal-section { margin-bottom: 1.25rem; }
    .modal-section-title { font-size: 0.7rem; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-soft); }
    .field-error { display: none; font-size: 0.8rem; color: var(--danger); margin-top: 0.25rem; padding: 0.5rem 0.75rem; background: var(--danger-bg); border-radius: 6px; border: 1px solid rgba(239,68,68,0.2); }
    .modal-footer { padding: 1rem 1.5rem 1.25rem; display: flex; gap: 0.5rem; flex-shrink: 0; border-top: 1px solid var(--border-soft); background: var(--bg-card); }
    .modal-footer .btn-primary { flex: 1; }

    /* ══════════════════════════════════════════════════
       MODAL — slot item picker
    ══════════════════════════════════════════════════ */
    .slot-picker-modal { max-width: 440px; }
    .slot-picker-search { padding: 0.5rem 0.75rem; font-size: 0.88rem; background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); width: 100%; margin-bottom: 0.75rem; }
    .slot-picker-search:focus { border-color: var(--accent); outline: none; }
    .slot-picker-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
    .slot-picker-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.85rem; cursor: pointer;
      border-bottom: 1px solid var(--border); font-size: 0.85rem;
      transition: background 0.12s;
    }
    .slot-picker-row:last-child { border-bottom: none; }
    .slot-picker-row:hover { background: var(--bg-card2); }
    .slot-picker-row.selected { background: var(--accent-glow); border-left: 2px solid var(--accent); }
    .slot-picker-row.clear-row { color: var(--text-muted); font-style: italic; }
    .slot-picker-img {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      position: relative; overflow: hidden; background: var(--bg-card2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .slot-picker-img img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
    .slot-picker-img.quality-epic    { background: #1a0a2e; border-color: rgba(168,85,247,0.4); }
    .slot-picker-img.quality-epic_ii { background: #1a0a2e; border-color: rgba(139,92,246,0.5); }
    .slot-picker-img.quality-epic_ii::before {
      content: ''; position: absolute; inset: -40%;
      background: radial-gradient(ellipse at 60% 40%, rgba(180,80,255,0.55) 0%, transparent 65%),
                  radial-gradient(ellipse at 30% 70%, rgba(120,40,220,0.4) 0%, transparent 60%);
      animation: epic-fog 4s ease-in-out infinite alternate; z-index: 0;
    }
    .slot-picker-name { font-weight: 600; }
    .slot-picker-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .clb-body { grid-template-columns: 220px 1fr 220px 300px; height: 580px; }
      .slot-cell-icon { width: 46px; height: 46px; }
      .slot-cell-name { max-width: 120px; }
    }
    @media (max-width: 700px) {
      .clb-body { grid-template-columns: 1fr; height: auto; }
      .loot-silhouette { display: none; }
      .clb-item-card { margin: 0; border-radius: 0; border-top: 1px solid var(--border); }
      .loot-col-left { align-items: flex-start; }
      .loot-col-left .loot-slot-cell { flex-direction: row; }
      .loot-col-left .slot-cell-name  { text-align: left; }
      .loot-col-left .slot-cell-label { text-align: left; }
      .clb-info-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .profile-header { flex-direction: column; text-align: center; }
      .profile-name-row { justify-content: center; }
    }
  </style>
</head>
<body>

<nav class="navbar" id="main-nav"></nav>

<main class="container profile-container">

  <!-- Profile header -->
  <div class="profile-header" id="profile-header">
    <div class="profile-avatar" id="profile-avatar"><i class="fa-solid fa-user"></i></div>
    <div class="profile-info">
      <div class="profile-name-row">
        <h2 id="profile-name">Загрузка...</h2>
        <button class="btn-edit-profile" id="btn-edit-profile" title="Изменить имя">
          <i class="fas fa-pen"></i>
        </button>
      </div>
      <div class="username" id="profile-username">
        <i class="fas fa-at"></i>
        <span id="username-text">—</span>
      </div>
      <span class="profile-role" id="profile-role">guest</span>
      <div class="edit-profile-form" id="edit-profile-form">
        <div class="form-group">
          <label for="edit-display-name">Имя пользователя</label>
          <input type="text" id="edit-display-name" placeholder="Введите имя" maxlength="50" />
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="btn-save-profile">Сохранить</button>
          <button class="btn btn-ghost" id="btn-cancel-edit">Отмена</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Characters -->
  <div class="section-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <span class="section-title" style="font-size:0.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;">Персонаж</span>
    <button class="btn btn-primary btn-sm" id="btn-add-character">+ Добавить персонажа</button>
  </div>

  <div id="characters-list">
    <div class="empty-state">
      <span class="icon"><i class="fa-solid fa-gamepad"></i></span>
      <p>У вас пока нет персонажа</p>
      <small>Создайте персонажа, чтобы участвовать в рейдах</small>
    </div>
  </div>

</main>

<!-- ── MODAL: character name edit ── -->
<div class="modal-overlay hidden" id="modal-character">
  <div class="modal">
    <div class="modal-accent-bar"></div>
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-icon" id="modal-char-icon"><i class="fa-solid fa-khanda"></i></div>
        <div>
          <h3 id="modal-char-title">Редактировать персонажа</h3>
          <div class="modal-subtitle" id="modal-char-subtitle">Изменения уйдут на модерацию</div>
        </div>
      </div>
      <button class="btn-close" id="btn-char-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-char-id" />
      <input type="hidden" id="edit-char-status" />
      <div class="modal-section">
        <label class="field-label">Имя персонажа <span class="field-required">*</span></label>
        <input type="text" id="f-char-name" placeholder="Как вас знают в гильдии" />
      </div>
      <div class="modal-section" style="margin-bottom:0">
        <label class="field-label">Сообщение модератору</label>
        <textarea id="f-moderation-note" placeholder="Дополнительная информация..." rows="2" style="resize:vertical;min-height:52px;width:100%;padding:0.5rem 0.7rem;font-size:0.85rem;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;color:var(--text);"></textarea>
      </div>
      <div id="char-error" class="field-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-char-save">Отправить на модерацию</button>
      <button class="btn btn-ghost" id="btn-char-cancel">Отмена</button>
    </div>
  </div>
</div>

<!-- ── MODAL: slot item picker ── -->
<div class="modal-overlay hidden" id="modal-slot-picker">
  <div class="modal slot-picker-modal">
    <div class="modal-accent-bar"></div>
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-icon" id="picker-slot-icon"><i class="fa-solid fa-box-open"></i></div>
        <div>
          <h3 id="picker-slot-title">Выбор предмета</h3>
          <div class="modal-subtitle" id="picker-slot-subtitle">Слот</div>
        </div>
      </div>
      <button class="btn-close" id="btn-picker-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <input type="text" class="slot-picker-search" id="picker-search" placeholder="Поиск по названию..." autocomplete="off" />
      <div class="slot-picker-list" id="picker-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-picker-confirm" disabled>Добавить</button>
      <button class="btn btn-ghost" id="btn-picker-cancel">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { getUser, getRole, isModerator, isAdmin, getUserData, updateUserProfile } from "../js/modules/auth.js";
  import { getItems } from "../js/modules/items.js";
  import { getBosses } from "../js/modules/bosses.js";
  import { WEAPONS, SLOTS } from "../js/constants.js";
  import {
    collection, doc, getDocs, addDoc, updateDoc, query, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { db } from "../js/firebase.js";

  await initNavbar();

  const user     = getUser();
  const userRole = getRole();

  if (!user) {
    sessionStorage.setItem('redirect_after_login', window.location.pathname);
    window.location.href = '/pages/login.html';
    throw new Error('Not authenticated');
  }

  let allItems  = [];
  let allBosses = [];
  let characters = [];
  let userProfileData = null;
  const userId = user.uid;
  const userIsModerator = isModerator() || isAdmin();

  // ── Slot definitions ──────────────────────────────
  const LOOT_SLOTS_LEFT = [
    { id: 'weapon1',  label: 'Оружие 1',  baseSlot: 'weapon'   },
    { id: 'weapon2',  label: 'Оружие 2',  baseSlot: 'weapon'   },
    { id: 'helmet',   label: 'Шлем',      baseSlot: 'helmet'   },
    { id: 'chest',    label: 'Нагрудник', baseSlot: 'chest'    },
    { id: 'gloves',   label: 'Перчатки',  baseSlot: 'gloves'   },
    { id: 'pants',    label: 'Поножи',    baseSlot: 'pants'    },
    { id: 'boots',    label: 'Сапоги',    baseSlot: 'boots'    },
  ];
  const LOOT_SLOTS_RIGHT = [
    { id: 'cloak',    label: 'Плащ',      baseSlot: 'cloak'    },
    { id: 'necklace', label: 'Ожерелье',  baseSlot: 'necklace' },
    { id: 'ring1',    label: 'Кольцо 1',  baseSlot: 'ring'     },
    { id: 'ring2',    label: 'Кольцо 2',  baseSlot: 'ring'     },
    { id: 'bracelet', label: 'Браслет',   baseSlot: 'bracelet' },
    { id: 'belt',     label: 'Пояс',      baseSlot: 'belt'     },
  ];
  const ALL_LOOT_SLOTS = [...LOOT_SLOTS_LEFT, ...LOOT_SLOTS_RIGHT];

  // ── Иконки слотов ──────────────────────────────────
  // Чтобы использовать свою картинку вместо стандартной иконки — впишите
  // прямую ссылку на неё в поле "url" (PNG/SVG/WEBP). Если "url" пустой,
  // используется иконка Font Awesome из поля "fa".
  const SLOT_ICON = {
    weapon1:  { url: '', fa: 'fa-khanda' },
    weapon2:  { url: '', fa: 'fa-khanda' },
    helmet:   { url: '', fa: 'fa-helmet-safety' },
    chest:    { url: '', fa: 'fa-vest' },
    gloves:   { url: '', fa: 'fa-mitten' },
    pants:    { url: '', fa: 'fa-socks' },
    boots:    { url: '', fa: 'fa-shoe-prints' },
    cloak:    { url: '', fa: 'fa-vest-patches' },
    necklace: { url: '', fa: 'fa-gem' },
    ring1:    { url: '', fa: 'fa-ring' },
    ring2:    { url: '', fa: 'fa-ring' },
    bracelet: { url: '', fa: 'fa-circle-notch' },
    belt:     { url: '', fa: 'fa-link' },
  };
  function slotIconHtml(slotId) {
    const cfg = SLOT_ICON[slotId];
    if (cfg?.url) return `<img src="${cfg.url}" alt="" style="width:60%;height:60%;object-fit:contain;" />`;
    return `<i class="fa-solid ${cfg?.fa || 'fa-shield-halved'}"></i>`;
  }

  const ARMOR_SLOTS = ['helmet','cloak','chest','gloves','pants','boots'];
  function dmgLabel(slot) {
    if (slot === 'weapon') return 'Урон';
    if (ARMOR_SLOTS.includes(slot)) return 'Защита';
    return 'Защ. (магия)';
  }
  function qualityLabel(q) { return q === 'epic_ii' ? 'Эпическое II' : q === 'epic' ? 'Эпическое' : q || ''; }
  function getWeaponLabel(id) { return WEAPONS.find(w => w.id === id)?.label || id; }
  // Иконки типов оружия — та же схема: своя ссылка в "url", иначе Font Awesome.
  const WEAPON_ICON = {
    bow:          { url: '', fa: 'fa-crosshairs' },
    staff:        { url: '', fa: 'fa-wand-magic-sparkles' },
    wand:         { url: '', fa: 'fa-wand-magic-sparkles' },
    greatsword:   { url: '', fa: 'fa-khanda' },
    sword_shield: { url: '', fa: 'fa-shield-halved' },
    spear:        { url: '', fa: 'fa-khanda' },
    crossbow:     { url: '', fa: 'fa-crosshairs' },
    daggers:      { url: '', fa: 'fa-khanda' },
  };
  function getWeaponIconHtml(id) {
    const cfg = WEAPON_ICON[id];
    if (cfg?.url) return `<img src="${cfg.url}" alt="" style="width:60%;height:60%;object-fit:contain;" />`;
    return `<i class="fa-solid ${cfg?.fa || 'fa-khanda'}"></i>`;
  }

  // ── Shared item detail-card renderer (used both for the per-character
  // loot grid and the new-character creation draft) ──
  function buildItemCardHtml(item, obtained, slotLabel) {
    const boss    = allBosses.find(b => b.id === item.boss_id);
    const quality = item.quality || '';
    const stats   = item.stats || [];
    const effect  = item.effect || {};
    const setBonus = item.set_bonus || {};
    const props   = item.properties || [];
    const runes   = item.runes || [];
    const runesMax = item.runes_max || (runes.length ? runes.length : 3);
    const isWeapon = item.slot === 'weapon';
    const weaponTypeLabel = item.weapon_type ? getWeaponLabel(item.weapon_type) : null;

    // properties may be plain strings (legacy) or {label,value,level} objects
    const richProps = props.filter(p => typeof p === 'object' && p !== null);
    const plainProps = props.filter(p => typeof p === 'string');

    return `
      ${obtained ? `<div class="lic-obtained-banner"><i class="fa-solid fa-circle-check"></i> Получено — слот закрыт</div>` : ''}
      <div class="lic-topbar">
        <div class="lic-img-wrap ${quality ? `quality-${quality}` : ''}">
          ${item.image ? `<img src="${item.image}" alt="${item.name}" style="position:relative;z-index:1;" />` : slotIconHtml(item.slot)}
        </div>
        <div class="lic-topbar-right">
          <div class="lic-meta">
            ${quality ? `<span class="lic-badge qual">${qualityLabel(quality)}</span>` : ''}
            ${item.level ? `<span class="lic-badge level">Ур. ${item.level}</span>` : ''}
            ${weaponTypeLabel ? `<span class="lic-badge slot">${weaponTypeLabel}</span>` : `<span class="lic-badge slot">${slotLabel}</span>`}
          </div>
          ${item.wiki_url ? `<a class="lic-wiki-link" href="${item.wiki_url}" target="_blank" rel="noopener"><i class="fa-solid fa-book"></i> Где добыть — Вики</a>` : ''}
        </div>
      </div>
      <div class="lic-name">${item.name}${item.level ? ` · ур. ${item.level}` : ''}</div>
      ${(item.damage_min || item.damage_max) ? `
        <div class="lic-damage-box">
          ${item.damage_max ? `<div class="lic-damage-cell"><div class="lic-damage-cell-label">Макс. ${dmgLabel(item.slot)}</div><div class="lic-damage-cell-value">${item.damage_max}</div></div>` : ''}
          ${item.damage_min ? `<div class="lic-damage-cell"><div class="lic-damage-cell-label">Базовый ${dmgLabel(item.slot)}</div><div class="lic-damage-cell-value">${item.damage_min}</div></div>` : ''}
        </div>` : ''}
      ${isWeapon && (effect.name || effect.desc) ? `
        <div class="lic-effect">
          ${effect.image ? `<img src="${effect.image}" alt="effect" />` : `<div class="lic-effect-icon"><i class="fa-solid fa-bolt"></i></div>`}
          <div>
            ${effect.name ? `<div class="lic-effect-name">${effect.name}</div>` : ''}
            ${effect.desc ? `<div class="lic-effect-desc">${effect.desc}</div>` : ''}
          </div>
        </div>` : ''}
      ${stats.length ? `
        <div class="lic-stats">
          ${stats.map(s => `<div class="lic-stat"><span class="lic-stat-label">${s.label||s}</span><span class="lic-stat-value">${s.value||''}</span></div>`).join('')}
        </div>` : ''}
      ${!isWeapon && setBonus.name ? `
        <div class="lic-set-bonus">
          <div class="lic-set-name">${setBonus.name}</div>
          ${setBonus.piece2 ? `<div class="lic-set-piece"><span>(2):</span>${setBonus.piece2}</div>` : ''}
          ${setBonus.piece4 ? `<div class="lic-set-piece"><span>(4):</span>${setBonus.piece4}</div>` : ''}
        </div>` : ''}
      ${richProps.length ? `
        <div class="lic-section-title">Свойства снаряжения</div>
        <div class="lic-props-list">
          ${richProps.map(p => `<div class="lic-prop-row"><span class="lic-prop-dot"><i class="fa-solid fa-diamond"></i></span><span class="lic-prop-label">${p.label}</span><span class="lic-prop-value">${p.value ?? ''}</span>${p.level ? `<span class="lic-prop-lvl">ур.${p.level}</span>` : ''}</div>`).join('')}
        </div>` : ''}
      ${plainProps.length ? `<div class="lic-props">${plainProps.map(p => `<span class="lic-prop-tag">${p}</span>`).join('')}</div>` : ''}
      ${runes.length ? `
        <div class="lic-section-title">Руны (${runes.length}/${runesMax})</div>
        <div class="lic-runes-list">
          ${runes.map(r => `<div class="lic-rune-row"><span class="lic-rune-icon"><i class="fa-solid fa-gem"></i></span><span class="lic-rune-name">${r.name}</span>${r.tier ? `<span class="lic-rune-tier">${r.tier}</span>` : ''}</div>`).join('')}
        </div>` : ''}
      ${item.description ? `<div class="lic-flavor">${item.description}</div>` : ''}
      ${boss ? `
        <div class="lic-boss">
          ${boss.icon ? `<img src="/assets/img/bosses/${boss.icon}" alt="${boss.name}" />` : '<i class="fa-solid fa-skull"></i>'}
          <span>${boss.name}</span>
        </div>` : ''}
      ${(item.has_synergy || item.perception || item.shield_penetration) ? `
        <div class="lic-footer">
          ${item.has_synergy ? `<span class="lic-footer-badge">Синергия</span>` : ''}
          ${item.perception ? `<span>Восприятие ${item.perception}</span>` : ''}
          ${item.shield_penetration ? `<span>Пробивание щита ${item.shield_penetration}%</span>` : ''}
        </div>` : ''}
    `;
  }

  // ── Load ──────────────────────────────────────────
  async function loadData() {
    try { allItems  = await getItems();  } catch(e) { allItems  = []; }
    try { allBosses = await getBosses(); } catch(e) { allBosses = []; }
    try { await loadCharacters();        } catch(e) { characters = []; }
    try { userProfileData = await getUserData(userId); } catch(e) { userProfileData = null; }
    renderProfile();
    renderCharacters();
  }

  async function loadCharacters() {
    const q    = query(collection(db, 'characters'), where('user_id', '==', userId));
    const snap = await getDocs(q);
    characters = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    characters.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  }

  // ── Profile ───────────────────────────────────────
  function renderProfile() {
    const displayName = userProfileData?.displayName || userProfileData?.username || user.email?.split('@')[0] || 'Пользователь';
    const username    = userProfileData?.username || user.email?.split('@')[0] || 'user';
    document.getElementById('profile-name').textContent    = displayName;
    document.getElementById('username-text').textContent   = username;
    document.getElementById('profile-role').textContent    = userRole || 'guest';
    document.getElementById('profile-avatar').textContent  = displayName.charAt(0).toUpperCase();
  }

  // Profile name edit
  document.getElementById('btn-edit-profile').addEventListener('click', () => {
    const currentName = document.getElementById('profile-name').textContent;
    document.getElementById('edit-display-name').value = currentName;
    document.getElementById('edit-profile-form').classList.toggle('active');
    if (document.getElementById('edit-profile-form').classList.contains('active'))
      document.getElementById('edit-display-name').focus();
  });
  document.getElementById('btn-cancel-edit').addEventListener('click', () => {
    document.getElementById('edit-profile-form').classList.remove('active');
  });
  document.getElementById('btn-save-profile').addEventListener('click', async () => {
    const newName = document.getElementById('edit-display-name').value.trim();
    if (!newName) { showToast('Введите имя', 'error'); return; }
    const btn = document.getElementById('btn-save-profile');
    btn.disabled = true; btn.textContent = 'Сохранение...';
    try {
      const result = await updateUserProfile({ displayName: newName });
      if (result.success) {
        userProfileData = await getUserData(userId);
        renderProfile();
        document.getElementById('edit-profile-form').classList.remove('active');
        showToast('Имя обновлено!');
      } else { showToast(result.error || 'Ошибка', 'error'); }
    } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
  });

  // ── Render characters ─────────────────────────────
  function renderCharacters() {
    const container = document.getElementById('characters-list');
    const addBtn    = document.getElementById('btn-add-character');
    if (addBtn) addBtn.style.display = characters.length > 0 ? 'none' : '';

    if (!characters.length) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="icon"><i class="fa-solid fa-gamepad"></i></span>
          <p>У вас пока нет персонажа</p>
          <small>Создайте персонажа, чтобы участвовать в рейдах</small>
        </div>`;
      return;
    }

    container.innerHTML = '';
    characters.forEach(char => renderCharBlock(char, container));
  }

  function renderCharBlock(char, container) {
    const status        = char.status || 'pending';
    const isEditPending = char.previous_status === 'approved';
    const displayStatus = isEditPending ? 'pending' : status;
    const isApproved    = status === 'approved' && !isEditPending;
    const canEdit       = status !== 'approved' || isEditPending;

    const statusLabel = {
      pending:  isEditPending ? '<i class="fa-solid fa-pen-to-square"></i> Изменение на модерации' : '<i class="fa-solid fa-hourglass-half"></i> На модерации',
      approved: '<i class="fa-solid fa-circle-check"></i> Одобрен',
      rejected: '<i class="fa-solid fa-circle-xmark"></i> Отклонён',
    }[displayStatus] || '<i class="fa-solid fa-hourglass-half"></i> На модерации';

    const block = document.createElement('div');
    block.className = `char-loot-block ${displayStatus}`;
    block.id = `char-block-${char.id}`;

    // Weapons from desired_loot (derived from item weapon_type)
    const desired  = char.desired_loot || {};
    const wonItems = char.won_items || {};

    // Derive weapon types from weapon slot items
    const weaponTypes = [];
    ['weapon1','weapon2'].forEach(slot => {
      if (desired[slot]) {
        const item = allItems.find(i => i.id === desired[slot]);
        if (item?.weapon_type && !weaponTypes.includes(item.weapon_type))
          weaponTypes.push(item.weapon_type);
      }
    });

    const date = char.created_at
      ? new Date(char.created_at).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' })
      : '—';

    const desiredCount  = Object.values(desired).filter(Boolean).length;
    const obtainedCount = ALL_LOOT_SLOTS.filter(s => desired[s.id] && wonItems[s.id] === desired[s.id]).length;

    // Header
    const headerEl = document.createElement('div');
    headerEl.className = 'clb-header';
    headerEl.innerHTML = `
      <div class="clb-header-left">
        <div class="clb-char-icon">${getWeaponIconHtml(weaponTypes[0] || char.weapons?.[0] || '')}</div>
        <div>
          <div class="clb-char-name">${char.name}</div>
          <div class="clb-char-meta">
            <span class="char-status ${displayStatus}">
              <span class="dot"></span>${statusLabel}
            </span>
            ${weaponTypes.map(w => `<span class="weapon-tag">${getWeaponLabel(w)}</span>`).join('')}
          </div>
        </div>
      </div>
      <div class="clb-header-right">
        ${desiredCount ? `<span class="clb-progress"><span>${obtainedCount}</span> / ${desiredCount} получено</span>` : ''}
        ${(canEdit || isApproved) ? `<button class="btn-loot-edit-top" id="btn-edit-top-${char.id}" title="${isApproved ? 'Редактировать лут' : 'Редактировать персонажа'}"><i class="fa-solid fa-pen-to-square"></i></button>` : ''}
      </div>
    `;
    block.appendChild(headerEl);
    const editTopBtn = headerEl.querySelector('.btn-loot-edit-top');

    // If pending/rejected and no loot yet — simple view
    if (!isApproved && !Object.keys(desired).length) {
      const pendingBody = document.createElement('div');
      pendingBody.className = 'clb-pending-body';
      const weapons = char.weapons?.length
        ? char.weapons.map(w => `<span class="weapon-tag">${getWeaponLabel(w)}</span>`).join('')
        : '<span style="color:var(--text-muted)">Нет</span>';
      pendingBody.innerHTML = `
        <div class="clb-info-grid">
          <div class="clb-info-block">
            <span class="label"><i class="fa-solid fa-khanda"></i> Оружие</span>
            <div style="display:flex;flex-wrap:wrap;gap:0.4rem">${weapons}</div>
          </div>
          <div class="clb-info-block">
            <span class="label"><i class="fa-regular fa-calendar"></i> Создан</span>
            <div class="date-val">${date}</div>
          </div>
        </div>
        ${char.moderation_note     ? `<div class="char-moderation-note"><i class="fa-solid fa-comment"></i> ${char.moderation_note}</div>` : ''}
        ${char.moderation_feedback ? `<div class="char-moderation-feedback"><i class="fa-solid fa-pen-to-square"></i> Ответ: ${char.moderation_feedback}</div>` : ''}
        ${isEditPending && char.edit_note ? `<div class="char-moderation-note"><i class="fa-solid fa-pen"></i> На модерации: ${char.edit_note}</div>` : ''}
      `;
      block.appendChild(pendingBody);

      // Edit action lives in the header now (top-right), not in a footer
      if (canEdit && editTopBtn) editTopBtn.addEventListener('click', () => openEditModal(char));

      container.appendChild(block);
      return;
    }

    // ── Loot display ──────────────────────────────
    const bodyEl = document.createElement('div');
    bodyEl.className = 'clb-body';

    // Edit state
    let isEditing    = false;
    let pendingLoot  = { ...desired }; // local changes before save
    let activeSlotId = null;

    // Left column
    const colLeft = document.createElement('div');
    colLeft.className = 'loot-col loot-col-left';

    // Center silhouette
    const silhouette = document.createElement('div');
    silhouette.className = 'loot-silhouette';
    silhouette.innerHTML = `<img src="/assets/img/profileimgwarrior.png" alt=""
      onerror="this.remove(); this.parentElement.insertAdjacentHTML('beforeend', '&lt;div class=&quot;loot-silhouette-placeholder&quot;&gt;&lt;i class=&quot;fa-solid fa-user-large&quot;&gt;&lt;/i&gt;&lt;/div&gt;')" />`;

    // Right item card
    const cardEl = document.createElement('div');
    cardEl.className = 'clb-item-card empty-card';
    cardEl.innerHTML = `<div style="opacity:0.4;font-size:2rem;margin-bottom:0.5rem"><i class="fa-solid fa-crosshairs"></i></div><div>Наведите на слот</div>`;

    bodyEl.appendChild(colLeft);
    bodyEl.appendChild(silhouette);
    bodyEl.appendChild(cardEl);
    block.appendChild(bodyEl);

    // Build slot cells
    function buildCell(slotDef) {
      const cell = document.createElement('div');
      cell.dataset.slotId = slotDef.id;

      function refresh() {
        const itemId   = pendingLoot[slotDef.id];
        const item     = itemId ? allItems.find(i => i.id === itemId) : null;
        const obtained = !!(item && wonItems[slotDef.id] === itemId);
        const quality  = item?.quality || '';
        const editable = isEditing && !obtained;

        cell.className = 'loot-slot-cell' + (item ? ' has-item' : '') + (cell.dataset.slotId === activeSlotId ? ' active-slot' : '');

        // Icon — outer wrapper (unclipped, holds badge/hint) + inner clipped box
        const iconWrap = document.createElement('div');
        iconWrap.className = 'slot-cell-icon' + (editable ? ' editable-slot' : '');

        const iconInner = document.createElement('div');
        iconInner.className = 'slot-cell-icon-inner' + (quality ? ` quality-${quality}` : '') + (obtained ? ' obtained' : '') + (!item ? ' empty-slot' : '');

        if (item?.image) {
          const img = document.createElement('img');
          img.src = item.image; img.alt = item.name;
          img.style.cssText = 'position:relative;z-index:1;';
          iconInner.appendChild(img);
        } else {
          iconInner.innerHTML = slotIconHtml(slotDef.id);
        }
        iconWrap.appendChild(iconInner);

        if (obtained) {
          const badge = document.createElement('div');
          badge.className = 'slot-obtained-badge';
          badge.innerHTML = '<i class="fa-solid fa-check"></i>';
          iconWrap.appendChild(badge);
        }

        if (editable) {
          const hint = document.createElement('div');
          hint.className = 'slot-edit-hint';
          hint.innerHTML = item ? '<i class="fa-solid fa-pen"></i>' : '<i class="fa-solid fa-plus"></i>';
          iconInner.appendChild(hint);
        }

        // Text
        const info = document.createElement('div');
        info.className = 'slot-cell-info';
        const labelEl = document.createElement('div');
        labelEl.className = 'slot-cell-label';
        labelEl.textContent = slotDef.label;
        const nameEl = document.createElement('div');
        nameEl.className = 'slot-cell-name' + (obtained ? ' obtained-name' : !item ? ' empty-name' : quality === 'epic_ii' ? ' epic2-name' : quality === 'epic' ? ' epic-name' : '');
        nameEl.textContent = !item ? (isEditing && !obtained ? 'нажмите чтобы выбрать' : 'не выбрано') : item.name;

        info.appendChild(labelEl);
        info.appendChild(nameEl);
        cell.innerHTML = '';
        cell.appendChild(iconWrap);
        cell.appendChild(info);

        // Events
        if (item) {
          cell.addEventListener('mouseenter', () => {
            block.querySelectorAll('.loot-slot-cell').forEach(c => c.classList.remove('active-slot'));
            cell.classList.add('active-slot');
            activeSlotId = slotDef.id;
            renderItemCard(item, obtained, slotDef.label);
          });
        }

        if (editable) {
          iconWrap.addEventListener('click', () => openSlotPicker(slotDef, char, pendingLoot, wonItems, (newItemId) => {
            pendingLoot[slotDef.id] = newItemId;
            refresh();
            // Update confirm button label
            const confirmBtn = block.querySelector('.btn-confirm-edit');
            if (confirmBtn) confirmBtn.textContent = newItemId ? 'Изменить' : 'Добавить';
            // Update card if active
            if (activeSlotId === slotDef.id && newItemId) {
              const newItem = allItems.find(i => i.id === newItemId);
              if (newItem) renderItemCard(newItem, false, slotDef.label);
            }
            // Recheck weapons derived
            updateDerivedWeapons();
          }));
        }

        if (!item && isEditing && !obtained) {
          cell.classList.add('has-item');
          cell.addEventListener('mouseenter', () => {
            block.querySelectorAll('.loot-slot-cell').forEach(c => c.classList.remove('active-slot'));
            cell.classList.add('active-slot');
            activeSlotId = slotDef.id;
          });
        }
      }

      refresh();
      cell._refresh = refresh;
      return cell;
    }

    const rightCol = document.createElement('div');
    rightCol.className = 'loot-col loot-col-right';

    LOOT_SLOTS_LEFT.forEach(s => {
      const cell = buildCell(s);
      colLeft.appendChild(cell);
    });
    LOOT_SLOTS_RIGHT.forEach(s => {
      const cell = buildCell(s);
      rightCol.appendChild(cell);
    });
    bodyEl.insertBefore(rightCol, cardEl);

    // Show default item card — prefer weapon1, then weapon2, then first filled slot
    const weaponDefault = ['weapon1', 'weapon2']
      .map(id => LOOT_SLOTS_LEFT.find(s => s.id === id))
      .find(s => desired[s.id] && allItems.find(i => i.id === desired[s.id]));
    const defaultSlotDef = weaponDefault || ALL_LOOT_SLOTS.find(s => desired[s.id] && allItems.find(i => i.id === desired[s.id]));
    if (defaultSlotDef) {
      const item = allItems.find(i => i.id === desired[defaultSlotDef.id]);
      if (item) {
        const obtained = wonItems[defaultSlotDef.id] === desired[defaultSlotDef.id];
        setTimeout(() => {
          const cell = block.querySelector(`[data-slot-id="${defaultSlotDef.id}"]`);
          if (cell) { cell.classList.add('active-slot'); activeSlotId = defaultSlotDef.id; }
          renderItemCard(item, obtained, defaultSlotDef.label);
        }, 0);
      }
    }

    // Item card renderer
    function renderItemCard(item, obtained, slotLabel) {
      cardEl.className = 'clb-item-card';
      cardEl.innerHTML = buildItemCardHtml(item, obtained, slotLabel);
    }

    // Derived weapons update
    function updateDerivedWeapons() {
      const types = [];
      ['weapon1','weapon2'].forEach(slot => {
        if (pendingLoot[slot]) {
          const item = allItems.find(i => i.id === pendingLoot[slot]);
          if (item?.weapon_type && !types.includes(item.weapon_type)) types.push(item.weapon_type);
        }
      });
      const metaEl = block.querySelector('.clb-char-meta');
      if (metaEl) {
        // Keep status pill, update weapon tags
        const statusEl = metaEl.querySelector('.char-status');
        metaEl.innerHTML = '';
        if (statusEl) metaEl.appendChild(statusEl);
        types.forEach(w => {
          const tag = document.createElement('span');
          tag.className = 'weapon-tag';
          tag.textContent = getWeaponLabel(w);
          metaEl.appendChild(tag);
        });
      }
    }

    // Edit note section (hidden until edit mode)
    const editNoteEl = document.createElement('div');
    editNoteEl.className = 'clb-edit-note';
    editNoteEl.style.display = 'none';
    editNoteEl.innerHTML = `
      <label>Сообщение модератору</label>
      <textarea placeholder="Опишите что изменили..." rows="2"></textarea>
    `;
    block.appendChild(editNoteEl);

    // Moderation notes
    if (char.moderation_note || char.moderation_feedback) {
      const notesEl = document.createElement('div');
      notesEl.style.cssText = 'padding:0 1.5rem 1rem;';
      notesEl.innerHTML = `
        ${char.moderation_note     ? `<div class="char-moderation-note"><i class="fa-solid fa-comment"></i> ${char.moderation_note}</div>` : ''}
        ${char.moderation_feedback ? `<div class="char-moderation-feedback"><i class="fa-solid fa-pen-to-square"></i> Ответ: ${char.moderation_feedback}</div>` : ''}
        ${isEditPending && char.edit_note ? `<div class="char-moderation-note"><i class="fa-solid fa-pen"></i> На модерации: ${char.edit_note}</div>` : ''}
      `;
      block.appendChild(notesEl);
    }

    // Footer
    const footer = document.createElement('div');
    footer.className = 'clb-footer';
    block.appendChild(footer);

    function renderFooter() {
      footer.innerHTML = '';
      if (isEditing) {
        const note = document.createElement('span');
        note.className = 'clb-footer-note';
        note.textContent = 'Изменения отправятся на модерацию';
        const actions = document.createElement('div');
        actions.className = 'clb-footer-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn btn-ghost btn-sm';
        cancelBtn.textContent = 'Отмена';
        cancelBtn.addEventListener('click', cancelEdit);
        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn btn-primary btn-sm btn-confirm-edit';
        saveBtn.textContent = 'Сохранить изменения';
        saveBtn.addEventListener('click', () => saveLoot(char, pendingLoot, editNoteEl.querySelector('textarea').value.trim()));
        actions.appendChild(cancelBtn);
        actions.appendChild(saveBtn);
        footer.appendChild(note);
        footer.appendChild(actions);
      } else {
        // Nothing shown here while not editing — the edit action lives
        // in the header (top-right), not tucked away at the bottom.
        footer.innerHTML = '';
      }
    }

    // Header edit button drives both "edit loot" (approved) and
    // "edit character" (pending/rejected) from the same top-right icon.
    if (editTopBtn) {
      editTopBtn.addEventListener('click', () => {
        if (!isApproved) { openEditModal(char); return; }
        enterEditMode();
      });
    }

    function enterEditMode() {
      isEditing = true;
      pendingLoot = { ...desired };
      editNoteEl.style.display = 'block';
      editNoteEl.querySelector('textarea').value = '';
      block.querySelectorAll('.loot-slot-cell').forEach(cell => {
        if (cell._refresh) cell._refresh();
      });
      renderFooter();
    }

    function cancelEdit() {
      isEditing = false;
      pendingLoot = { ...desired };
      editNoteEl.style.display = 'none';
      block.querySelectorAll('.loot-slot-cell').forEach(cell => {
        if (cell._refresh) cell._refresh();
      });
      renderFooter();
    }

    renderFooter();
    container.appendChild(block);
  }

  // ── Save loot changes ─────────────────────────────
  async function saveLoot(char, pendingLoot, note) {
    // Derive weapons from weapon slots
    const weaponTypes = [];
    ['weapon1','weapon2'].forEach(slot => {
      if (pendingLoot[slot]) {
        const item = allItems.find(i => i.id === pendingLoot[slot]);
        if (item?.weapon_type && !weaponTypes.includes(item.weapon_type))
          weaponTypes.push(item.weapon_type);
      }
    });

    const data = {
      desired_loot:        pendingLoot,
      weapons:             weaponTypes,
      status:              userIsModerator ? 'approved' : 'pending',
      previous_status:     userIsModerator ? null : 'approved',
      edit_note:           note || 'Изменение желаемого лута',
      moderation_note:     note || null,
      moderation_feedback: null,
      moderated_by:        userIsModerator ? user.uid : null,
      moderated_at:        userIsModerator ? new Date().toISOString() : null,
      updated_at:          new Date().toISOString(),
    };

    const block   = document.getElementById(`char-block-${char.id}`);
    const saveBtn = block?.querySelector('.btn-confirm-edit');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Сохранение...'; }

    try {
      await updateDoc(doc(db, 'characters', char.id), data);
      showToast(userIsModerator ? 'Лут обновлён!' : 'Изменения отправлены на модерацию!');
      await loadCharacters();
      renderCharacters();
    } catch(e) {
      showToast('Ошибка: ' + e.message, 'error');
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Сохранить изменения'; }
    }
  }

  // ── Slot picker modal ────────────────────────────
  let _pickerResolve = null;

  function openSlotPicker(slotDef, char, pendingLoot, wonItems, onSelect) {
    const modal     = document.getElementById('modal-slot-picker');
    const titleEl   = document.getElementById('picker-slot-title');
    const subtitleEl = document.getElementById('picker-slot-subtitle');
    const iconEl    = document.getElementById('picker-slot-icon');
    const searchEl  = document.getElementById('picker-search');
    const listEl    = document.getElementById('picker-list');
    const confirmEl = document.getElementById('btn-picker-confirm');

    titleEl.textContent    = slotDef.label;
    subtitleEl.textContent = slotDef.label;
    iconEl.innerHTML       = slotIconHtml(slotDef.id);
    searchEl.value         = '';
    confirmEl.disabled     = true;
    confirmEl.textContent  = 'Добавить';

    let selectedItemId = pendingLoot[slotDef.id] || null;
    if (selectedItemId) {
      const cur = allItems.find(i => i.id === selectedItemId);
      confirmEl.disabled    = false;
      confirmEl.textContent = cur ? 'Изменить' : 'Добавить';
    }

    // Filter items by base slot + weapon type if applicable
    function getSlotItems() {
      let pool = allItems.filter(i => i.slot === slotDef.baseSlot);
      if (slotDef.baseSlot === 'weapon') {
        // Determine allowed weapon types from the OTHER weapon slot
        const otherSlot = slotDef.id === 'weapon1' ? 'weapon2' : 'weapon1';
        const otherItemId = pendingLoot[otherSlot];
        const otherItem   = otherItemId ? allItems.find(i => i.id === otherItemId) : null;
        // Both weapon slots can have any weapon type, but different ones
        if (otherItem?.weapon_type) {
          pool = pool.filter(i => i.weapon_type !== otherItem.weapon_type);
        }
      }
      return pool;
    }

    function renderList(filter) {
      listEl.innerHTML = '';
      const pool = getSlotItems().filter(i => !filter || i.name?.toLowerCase().includes(filter.toLowerCase()));

      // Clear row
      const clearRow = document.createElement('div');
      clearRow.className = 'slot-picker-row clear-row' + (selectedItemId === null ? ' selected' : '');
      clearRow.innerHTML = `<div style="font-size:1.2rem"><i class="fa-solid fa-xmark"></i></div><div><div class="slot-picker-name">Не выбрано</div><div class="slot-picker-sub">Очистить слот</div></div>`;
      clearRow.addEventListener('click', () => {
        selectedItemId = null;
        confirmEl.disabled    = false;
        confirmEl.textContent = 'Удалить';
        renderList(searchEl.value);
      });
      listEl.appendChild(clearRow);

      if (!pool.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:1rem;text-align:center;color:var(--text-muted);font-size:0.85rem;';
        empty.textContent = 'Нет предметов';
        listEl.appendChild(empty);
        return;
      }

      pool.forEach(item => {
        const row = document.createElement('div');
        const q   = item.quality || '';
        row.className = 'slot-picker-row' + (item.id === selectedItemId ? ' selected' : '');
        const slotLabel = SLOTS.find(s => s.id === item.slot)?.label || item.slot;
        row.innerHTML = `
          <div class="slot-picker-img ${q ? `quality-${q}` : ''}">
            ${item.image ? `<img src="${item.image}" alt="${item.name}" style="position:relative;z-index:1;" />` : slotIconHtml(slotDef.id)}
          </div>
          <div>
            <div class="slot-picker-name ${q === 'epic_ii' ? 'epic2-name' : q === 'epic' ? 'epic-name' : ''}">${item.name}</div>
            <div class="slot-picker-sub">${slotLabel}${item.level ? ` · Ур. ${item.level}` : ''}${q ? ` · ${qualityLabel(q)}` : ''}</div>
          </div>
        `;
        row.addEventListener('click', () => {
          selectedItemId = item.id;
          confirmEl.disabled    = false;
          confirmEl.textContent = pendingLoot[slotDef.id] ? 'Изменить' : 'Добавить';
          renderList(searchEl.value);
        });
        listEl.appendChild(row);
      });
    }

    renderList('');
    searchEl.addEventListener('input', () => renderList(searchEl.value));

    confirmEl.onclick = () => {
      onSelect(selectedItemId);
      closePicker();
    };

    modal.classList.remove('hidden');
    requestAnimationFrame(() => modal.classList.add('open'));
    setTimeout(() => searchEl.focus(), 100);
  }

  function closePicker() {
    const modal = document.getElementById('modal-slot-picker');
    modal.classList.remove('open');
    setTimeout(() => modal.classList.add('hidden'), 250);
    document.getElementById('picker-search').removeEventListener('input', () => {});
  }

  document.getElementById('btn-picker-close').addEventListener('click', closePicker);
  document.getElementById('btn-picker-cancel').addEventListener('click', closePicker);
  document.getElementById('modal-slot-picker').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-slot-picker')) closePicker();
  });

  // ── Character name/note modal ────────────────────
  function openEditModal(char) {
    document.getElementById('edit-char-id').value     = char?.id     || '';
    document.getElementById('edit-char-status').value = char?.status || '';
    document.getElementById('f-char-name').value      = char?.name   || '';
    document.getElementById('f-moderation-note').value = '';
    document.getElementById('char-error').style.display = 'none';
    document.getElementById('modal-char-title').textContent    = char ? 'Редактировать персонажа' : 'Добавить персонажа';
    document.getElementById('modal-char-subtitle').textContent = char ? 'Изменения уйдут на модерацию' : 'Заполните данные';
    document.getElementById('modal-char-icon').innerHTML       = char ? '<i class="fa-solid fa-pen"></i>' : '<i class="fa-solid fa-khanda"></i>';
    document.getElementById('btn-char-save').textContent       = char ? 'Отправить на модерацию' : 'Создать персонажа';
    document.getElementById('modal-character').classList.remove('hidden');
    requestAnimationFrame(() => document.getElementById('modal-character').classList.add('open'));
  }

  function closeModal() {
    const overlay = document.getElementById('modal-character');
    overlay.classList.remove('open');
    setTimeout(() => overlay.classList.add('hidden'), 250);
  }

  document.getElementById('btn-char-close').addEventListener('click', closeModal);
  document.getElementById('btn-char-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-character').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-character')) closeModal();
  });

  document.getElementById('btn-char-save').addEventListener('click', async () => {
    const name    = document.getElementById('f-char-name').value.trim();
    const note    = document.getElementById('f-moderation-note').value.trim();
    const id      = document.getElementById('edit-char-id').value;
    const curStatus = document.getElementById('edit-char-status').value;
    const errorEl = document.getElementById('char-error');

    if (!name) { errorEl.textContent = 'Введите имя персонажа'; errorEl.style.display = 'block'; return; }
    errorEl.style.display = 'none';

    const isEdit = !!id;
    const char   = characters.find(c => c.id === id);

    const data = {
      name,
      user_id:             user.uid,
      user_email:          user.email,
      status:              userIsModerator ? 'approved' : 'pending',
      previous_status:     (isEdit && curStatus === 'approved' && !userIsModerator) ? 'approved' : null,
      edit_note:           (isEdit && curStatus === 'approved' && !userIsModerator) ? (note || 'Изменение имени') : null,
      moderation_note:     note || null,
      moderation_feedback: null,
      moderated_by:        userIsModerator ? user.uid : null,
      moderated_at:        userIsModerator ? new Date().toISOString() : null,
      updated_at:          new Date().toISOString(),
    };

    // Preserve existing fields on edit
    if (isEdit && char) {
      data.weapons     = char.weapons     || [];
      data.desired_loot = char.desired_loot || {};
      data.won_items   = char.won_items   || {};
    }

    const saveBtn = document.getElementById('btn-char-save');
    saveBtn.disabled = true; saveBtn.textContent = 'Сохранение...';
    try {
      if (isEdit) {
        await updateDoc(doc(db, 'characters', id), data);
        showToast(userIsModerator ? 'Персонаж обновлён!' : 'Изменения отправлены на модерацию!');
      } else {
        await addDoc(collection(db, 'characters'), { ...data, weapons: [], desired_loot: {}, won_items: {}, created_at: new Date().toISOString() });
        showToast(userIsModerator ? 'Персонаж создан!' : 'Персонаж отправлен на модерацию!');
      }
      closeModal();
      await loadCharacters();
      renderCharacters();
    } catch(e) {
      errorEl.textContent = 'Ошибка: ' + e.message; errorEl.style.display = 'block';
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = isEdit ? 'Отправить на модерацию' : 'Создать персонажа';
    }
  });

  document.getElementById('btn-add-character').addEventListener('click', () => {
    if (characters.length > 0) { showToast('У вас уже есть персонаж', 'error'); return; }
    renderCreateCharacterCard();
  });

  // ── Inline "create character" card ─────────────────
  // Same look & interaction as editing an approved character's loot,
  // but with an editable name field and every slot starting empty —
  // so it's obvious exactly what's being sent to moderation.
  function renderCreateCharacterCard() {
    const addBtnEl = document.getElementById('btn-add-character');
    if (addBtnEl) addBtnEl.style.display = 'none';

    const list = document.getElementById('characters-list');
    list.innerHTML = '';

    const block = document.createElement('div');
    block.className = 'char-loot-block pending';
    block.id = 'char-block-draft';

    // Header — editable name instead of a static title
    const headerEl = document.createElement('div');
    headerEl.className = 'clb-header';
    headerEl.innerHTML = `
      <div class="clb-header-left">
        <div class="clb-char-icon" id="draft-char-icon"><i class="fa-solid fa-khanda"></i></div>
        <div>
          <input type="text" class="draft-name-input" id="draft-char-name" placeholder="Имя персонажа" maxlength="50" />
          <div class="clb-char-meta">
            <span class="char-status pending"><span class="dot"></span><i class="fa-solid fa-pen-to-square"></i> Новый персонаж — заполните лут</span>
          </div>
        </div>
      </div>
      <div class="clb-header-right"></div>
    `;
    block.appendChild(headerEl);

    const bodyEl = document.createElement('div');
    bodyEl.className = 'clb-body';

    let pendingLoot = {};
    let activeSlotId = null;

    const colLeft = document.createElement('div');
    colLeft.className = 'loot-col loot-col-left';
    const silhouette = document.createElement('div');
    silhouette.className = 'loot-silhouette';
    silhouette.innerHTML = `<img src="/assets/img/profileimgwarrior.png" alt=""
      onerror="this.remove(); this.parentElement.insertAdjacentHTML('beforeend', '&lt;div class=&quot;loot-silhouette-placeholder&quot;&gt;&lt;i class=&quot;fa-solid fa-user-large&quot;&gt;&lt;/i&gt;&lt;/div&gt;')" />`;
    const rightCol = document.createElement('div');
    rightCol.className = 'loot-col loot-col-right';
    const cardEl = document.createElement('div');
    cardEl.className = 'clb-item-card empty-card';
    const emptyCardHtml = `<div style="opacity:0.4;font-size:2rem;margin-bottom:0.5rem"><i class="fa-solid fa-crosshairs"></i></div><div>Нажмите на слот, чтобы выбрать желаемый предмет</div>`;
    cardEl.innerHTML = emptyCardHtml;

    bodyEl.appendChild(colLeft);
    bodyEl.appendChild(silhouette);
    bodyEl.appendChild(rightCol);
    bodyEl.appendChild(cardEl);
    block.appendChild(bodyEl);

    function updateDerivedWeaponsDraft() {
      const w1 = pendingLoot.weapon1 ? allItems.find(i => i.id === pendingLoot.weapon1) : null;
      const iconEl = document.getElementById('draft-char-icon');
      if (iconEl) iconEl.innerHTML = getWeaponIconHtml(w1?.weapon_type || '');
    }

    function buildDraftCell(slotDef) {
      const cell = document.createElement('div');
      cell.dataset.slotId = slotDef.id;

      function refresh() {
        const itemId  = pendingLoot[slotDef.id];
        const item    = itemId ? allItems.find(i => i.id === itemId) : null;
        const quality = item?.quality || '';

        cell.className = 'loot-slot-cell has-item' + (cell.dataset.slotId === activeSlotId ? ' active-slot' : '');

        const iconWrap = document.createElement('div');
        iconWrap.className = 'slot-cell-icon editable-slot';
        const iconInner = document.createElement('div');
        iconInner.className = 'slot-cell-icon-inner' + (quality ? ` quality-${quality}` : '') + (!item ? ' empty-slot' : '');
        if (item?.image) {
          const img = document.createElement('img');
          img.src = item.image; img.alt = item.name;
          img.style.cssText = 'position:relative;z-index:1;';
          iconInner.appendChild(img);
        } else {
          iconInner.innerHTML = slotIconHtml(slotDef.id);
        }
        const hint = document.createElement('div');
        hint.className = 'slot-edit-hint';
        hint.innerHTML = item ? '<i class="fa-solid fa-pen"></i>' : '<i class="fa-solid fa-plus"></i>';
        iconInner.appendChild(hint);
        iconWrap.appendChild(iconInner);

        const info = document.createElement('div');
        info.className = 'slot-cell-info';
        const labelEl = document.createElement('div');
        labelEl.className = 'slot-cell-label';
        labelEl.textContent = slotDef.label;
        const nameEl = document.createElement('div');
        nameEl.className = 'slot-cell-name' + (!item ? ' empty-name' : quality === 'epic_ii' ? ' epic2-name' : quality === 'epic' ? ' epic-name' : '');
        nameEl.textContent = !item ? 'нажмите чтобы выбрать' : item.name;
        info.appendChild(labelEl);
        info.appendChild(nameEl);

        cell.innerHTML = '';
        cell.appendChild(iconWrap);
        cell.appendChild(info);

        cell.addEventListener('mouseenter', () => {
          block.querySelectorAll('.loot-slot-cell').forEach(c => c.classList.remove('active-slot'));
          cell.classList.add('active-slot');
          activeSlotId = slotDef.id;
          if (item) { cardEl.className = 'clb-item-card'; cardEl.innerHTML = buildItemCardHtml(item, false, slotDef.label); }
        });
