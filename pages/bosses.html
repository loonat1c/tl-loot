<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Боссы — TL Loot</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    /* ── общий макет ─────────────────────────────────────────── */
    .boss-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    @media (max-width: 820px) {
      .boss-layout {
        grid-template-columns: 1fr;
      }
    }

    /* ── левая колонка (список) ─────────────────────────────── */
    .boss-list {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.25rem;
      max-height: 75vh;
      overflow-y: auto;
    }

    .boss-list-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background 0.1s, border-color 0.1s;
      border-left: 3px solid transparent;
    }
    .boss-list-item:hover {
      background: var(--bg-card2);
    }
    .boss-list-item.active {
      background: var(--accent-glow);
      border-left-color: var(--accent);
    }

    .boss-list-item .level-badge {
      background: var(--bg-card2);
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .boss-list-item .name {
      font-weight: 600;
      flex: 1;
    }
    .boss-list-item .class-tag {
      font-size: 0.65rem;
      padding: 0.1rem 0.6rem;
      border-radius: 12px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ── правая колонка (детали) ───────────────────────────── */
    .boss-detail {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      min-height: 450px;
    }

    .boss-detail-bg {
      position: absolute;
      top: 5%;
      right: -10%;
      width: 70%;
      height: 85%;
      background-size: contain;
      background-position: right top;
      background-repeat: no-repeat;
      opacity: 0.2;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .boss-detail-bg.has-image {
      opacity: 0.3;
    }

    .boss-detail-content {
      position: relative;
      z-index: 1;
    }

    .boss-detail-header {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }

    .boss-detail-header .boss-icon-large {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-card2);
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 0;
    }

    .boss-detail-header .boss-icon-large.error {
      display: none;
    }

    .boss-detail-info {
      flex: 1;
      min-width: 0;
    }
    .boss-detail-info .name-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .boss-detail-info .name-row h2 {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.2;
    }
    .boss-detail-info .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.25rem 0 0.5rem 0;
    }
    .boss-detail-info .meta .badge {
      display: inline-block;
    }
    .boss-detail-info .description {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .boss-detail-items {
      margin-top: 1.25rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .boss-detail-items h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 0 0 0.65rem 0;
    }
    
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    
    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.3rem 0.5rem;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .item-row:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
    }
    
    .item-row img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg-card);
      flex-shrink: 0;
    }
    
    .item-row .item-name {
      font-size: 0.82rem;
      font-weight: 500;
      flex: 1;
    }
    
    .item-row .item-slot {
      font-size: 0.65rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 0.1rem 0.5rem;
      border-radius: 10px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge-beast     { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border-color: #f59e0b; }
    .badge-undead    { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; border-color: #8b5cf6; }
    .badge-humanoid  { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border-color: #3b82f6; }
    .badge-mechanism { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border-color: #9ca3af; }
    .badge-demon     { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-header h3 { font-size: 1.1rem; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; }
    .btn-close:hover { color: var(--text); }

    .items-picker { border: 1px solid var(--border); border-radius: var(--radius); max-height: 200px; overflow-y: auto; margin-top: 0.5rem; }
    .item-pick-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.4rem 0.75rem; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.15s;
      font-size: 0.85rem;
    }
    .item-pick-row:last-child { border-bottom: none; }
    .item-pick-row:hover { background: var(--bg-card2); }
    .item-pick-row.selected { background: var(--accent-glow); }
    .item-pick-row img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; background: var(--bg-card2); }
    .item-pick-check { margin-left: auto; color: var(--accent); font-size: 1rem; }

    .filter-bar { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .filter-bar input { max-width: 200px; }
    .filter-bar select { width: auto; }

    .flex { display: flex; }
    .gap-1 { gap: 0.5rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 1.5rem; }
    .text-danger { color: #ef4444; }
    .text-muted { color: var(--text-muted); }
    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .boss-detail-bg {
        width: 100%;
        height: 60%;
        top: 10%;
        right: 0;
        opacity: 0.15 !important;
      }
      .boss-detail-bg.has-image {
        opacity: 0.2 !important;
      }
      .boss-detail-header .boss-icon-large {
        width: 36px;
        height: 36px;
      }
      .boss-detail-info .name-row h2 {
        font-size: 1.1rem;
      }
    }

    /* ── ПОЛНАЯ КАРТОЧКА ПРИ НАВЕДЕНИИ (как в items.html) ── */
    .item-tooltip {
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 1.25rem;
      width: 440px;
      max-width: 80vw;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 48px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .item-tooltip.visible {
      display: block;
      opacity: 1;
    }

    .item-tooltip::-webkit-scrollbar {
      width: 4px;
    }
    .item-tooltip::-webkit-scrollbar-track {
      background: var(--bg-card2);
      border-radius: 4px;
    }
    .item-tooltip::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .item-tooltip .fc-header {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.75rem;
      align-items: flex-start;
    }

    .item-tooltip .fc-header .fc-img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-card2);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .item-tooltip .fc-header .fc-title {
      flex: 1;
      min-width: 0;
    }

    .item-tooltip .fc-header .fc-title .fc-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .item-tooltip .fc-header .fc-title .fc-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.6rem;
      margin-top: 4px;
    }

    .item-tooltip .fc-header .fc-title .fc-quality {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .item-tooltip .fc-header .fc-title .fc-level {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg-card2);
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .item-tooltip .fc-damage {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      padding: 0.4rem 0.5rem;
      background: var(--bg-card2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }

    .item-tooltip .fc-damage .damage-label {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }

    .item-tooltip .fc-set-bonus {
      margin: 0.5rem 0;
      padding: 0.5rem 0.75rem;
      background: rgba(245, 158, 11, 0.08);
      border-radius: var(--radius);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .item-tooltip .fc-set-bonus .set-name {
      font-weight: 700;
      color: var(--warning);
      font-size: 0.9rem;
    }

    .item-tooltip .fc-set-bonus .set-pieces {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-top: 0.3rem;
    }

    .item-tooltip .fc-set-bonus .set-pieces .set-piece {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .item-tooltip .fc-set-bonus .set-pieces .set-piece .pieces-label {
      color: var(--text);
      font-weight: 600;
      margin-right: 0.3rem;
    }

    .item-tooltip .fc-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem 1rem;
      margin: 0.5rem 0;
      padding: 0.5rem;
      background: var(--bg-card2);
      border-radius: var(--radius);
    }

    .item-tooltip .fc-stats .stat {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .item-tooltip .fc-stats .stat .stat-label {
      color: var(--text-muted);
    }

    .item-tooltip .fc-stats .stat .stat-value {
      color: var(--text);
      font-weight: 500;
    }

    .item-tooltip .fc-effect {
      display: flex;
      gap: 0.75rem;
      margin: 0.75rem 0;
      padding: 0.75rem;
      background: rgba(124, 58, 237, 0.08);
      border-radius: var(--radius);
      border: 1px solid var(--accent-glow);
    }

    .item-tooltip .fc-effect .effect-icon {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg-card2);
      flex-shrink: 0;
    }

    .item-tooltip .fc-effect .effect-info {
      flex: 1;
      font-size: 0.82rem;
    }

    .item-tooltip .fc-effect .effect-info .effect-name {
      font-weight: 600;
      color: var(--accent-soft);
    }

    .item-tooltip .fc-effect .effect-info .effect-desc {
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-tooltip .fc-properties {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .item-tooltip .fc-properties .prop-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .item-tooltip .fc-properties .prop-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }

    .item-tooltip .fc-properties .prop-list .prop-tag {
      background: var(--bg-card2);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .item-tooltip .fc-flavor {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      border-top: 1px solid var(--border);
    }

    .item-tooltip .fc-boss {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .item-tooltip .fc-boss .boss-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .item-tooltip .fc-boss .boss-icon.error {
      display: none;
    }

    .item-tooltip .fc-boss .boss-name {
      color: var(--text);
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .item-tooltip {
        position: fixed;
        left: 50% !important;
        right: auto !important;
        top: 50% !important;
        transform: translate(-50%, -50%);
        width: 92vw;
        max-height: 80vh;
      }
      .item-tooltip .fc-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<nav class="navbar" id="main-nav"></nav>

<main class="container">
  <div class="page-header">
    <h2>👹 Боссы</h2>
    <button class="btn btn-primary hidden" data-role="moderator" id="btn-add-boss">+ Добавить босса</button>
  </div>

  <div class="filter-bar">
    <input type="text" id="filter-search" placeholder="Поиск по имени..." />
    <select id="filter-class">
      <option value="">Все классы</option>
    </select>
  </div>

  <div class="boss-layout">
    <div class="boss-list" id="boss-list">
      <div class="text-muted" style="padding:1rem;">Загрузка...</div>
    </div>

    <div class="boss-detail" id="boss-detail">
      <div class="boss-detail-content">
        <div class="text-muted" style="padding:1rem 0;">Выберите босса из списка</div>
      </div>
    </div>
  </div>
</main>

<!-- Всплывающая карточка предмета (как в items.html) -->
<div class="item-tooltip" id="item-tooltip">
  <div class="fc-header">
    <img class="fc-img" id="tooltip-img" alt="" />
    <div class="fc-title">
      <div class="fc-name" id="tooltip-name">Название</div>
      <div class="fc-meta">
        <span class="fc-quality" id="tooltip-quality">Качество</span>
        <span class="fc-level" id="tooltip-level">Уровень</span>
        <span class="fc-quality" id="tooltip-slot">Слот</span>
      </div>
    </div>
  </div>
  <div id="tooltip-damage"></div>
  <div id="tooltip-stats"></div>
  <div id="tooltip-setbonus"></div>
  <div id="tooltip-effect"></div>
  <div id="tooltip-properties"></div>
  <div id="tooltip-flavor"></div>
  <div id="tooltip-boss"></div>
</div>

<!-- модалка -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Добавить босса</h3>
      <button class="btn-close" id="btn-modal-close">✕</button>
    </div>
    <input type="hidden" id="edit-id" />

    <div class="form-group">
      <label>Имя босса *</label>
      <input type="text" id="f-name" placeholder="Теневой Дракон" />
    </div>
    <div class="form-group">
      <label>Уровень</label>
      <input type="text" id="f-level" placeholder="50" />
    </div>
    <div class="form-group">
      <label>Класс босса</label>
      <select id="f-class">
        <option value="">— выбери класс —</option>
      </select>
    </div>
    <div class="form-group">
      <label>Описание</label>
      <textarea id="f-description" rows="2" placeholder="Необязательно..."></textarea>
    </div>
    <div class="form-group">
      <label>Фоновое изображение (из /assets/img/bosses/)</label>
      <input type="text" id="f-image" placeholder="draco.png" />
      <small style="color:var(--text-muted);font-size:0.7rem;">Укажите имя файла, картинка будет показана на фоне карточки</small>
    </div>
    <div class="form-group">
      <label>Иконка босса (из /assets/img/bosses/)</label>
      <input type="text" id="f-icon" placeholder="draco_icon.png" />
      <small style="color:var(--text-muted);font-size:0.7rem;">Укажите имя файла иконки (png, 32x32), будет использоваться в предметах</small>
    </div>
    <div class="form-group">
      <label>Предметы с босса</label>
      <input type="text" id="item-filter" placeholder="Поиск предметов..." style="margin-bottom:0.5rem" />
      <div class="items-picker" id="items-picker"></div>
    </div>

    <div id="modal-error" class="text-danger mt-1" style="display:none;font-size:0.85rem;"></div>
    <div class="flex gap-1 mt-3">
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
      <button class="btn btn-ghost" id="btn-cancel">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { initAuth, authReady, canWrite, isAdmin, currentRole } from "../js/modules/auth.js";
  
  initNavbar();
  initAuth();
  await authReady;

  import { getBosses, addBoss, updateBoss, deleteBoss } from "../js/modules/bosses.js";
  import { getItems } from "../js/modules/items.js";
  import { setItemImage } from "../js/modules/images.js";
  import { BOSS_CLASSES, SLOTS, QUALITY } from "../js/constants.js";

  const filterClass = document.getElementById("filter-class");
  const fClass = document.getElementById("f-class");
  BOSS_CLASSES.forEach(c => {
    filterClass.innerHTML += `<option value="${c.id}">${c.label}</option>`;
    fClass.innerHTML      += `<option value="${c.id}">${c.label}</option>`;
  });

  let allBosses = [];
  let allItems  = [];
  let selectedItemIds = [];
  let selectedBossId = null;

  function renderList() {
    const search = document.getElementById("filter-search").value.toLowerCase();
    const cls    = document.getElementById("filter-class").value;
    const list   = allBosses.filter(b => {
      if (search && !b.name.toLowerCase().includes(search)) return false;
      if (cls && b.boss_class !== cls) return false;
      return true;
    });

    const container = document.getElementById("boss-list");
    if (!list.length) {
      container.innerHTML = `<div class="text-muted" style="padding:1rem;">Боссов не найдено</div>`;
      return;
    }

    container.innerHTML = "";
    list.forEach(b => {
      const div = document.createElement("div");
      div.className = `boss-list-item${b.id === selectedBossId ? ' active' : ''}`;
      const clsLabel = BOSS_CLASSES.find(c => c.id === b.boss_class)?.label || b.boss_class || '—';
      
      div.innerHTML = `
        <span class="level-badge">${b.level || '?'}</span>
        <span class="name">${b.name}</span>
        <span class="class-tag badge-${b.boss_class || 'unknown'}">${clsLabel}</span>
      `;
      div.dataset.id = b.id;
      div.addEventListener('click', () => selectBoss(b.id));
      container.appendChild(div);
    });
  }

  function getDamageLabel(slotId) {
    const isWeapon = slotId === 'weapon';
    const isArmor = ['helmet', 'cloak', 'chest', 'gloves', 'pants', 'boots'].includes(slotId);
    const isAccessory = ['necklace', 'belt', 'ring', 'bracelet'].includes(slotId);

    if (isWeapon) return '🗡️ Урон';
    if (isArmor) return '🛡️ Защита (ближний/дальний)';
    if (isAccessory) return '🛡️ Защита (магия)';
    return '';
  }

  function renderDetail(b) {
    const container = document.getElementById("boss-detail");
    if (!b) {
      container.innerHTML = `
        <div class="boss-detail-content">
          <div class="text-muted" style="padding:1rem 0;">Выберите босса из списка</div>
        </div>
      `;
      return;
    }

    const clsLabel = BOSS_CLASSES.find(c => c.id === b.boss_class)?.label || b.boss_class || '—';
    const clsId = b.boss_class || 'unknown';
    const bItems = (b.item_ids || []).map(id => allItems.find(i => i.id === id)).filter(Boolean);

    const imageFile = b.image || '';
    const bgImage = imageFile ? `url('/assets/img/bosses/${imageFile}')` : '';
    const iconFile = b.icon ? `/assets/img/bosses/${b.icon}` : '';

    container.innerHTML = `
      <div class="boss-detail-bg ${bgImage ? 'has-image' : ''}" style="background-image: ${bgImage};"></div>
      <div class="boss-detail-content">
        <div class="boss-detail-header">
          ${iconFile ? `<img class="boss-icon-large" src="${iconFile}" alt="${b.name}" onerror="this.classList.add('error')" />` : ''}
          <div class="boss-detail-info">
            <div class="name-row">
              <h2>${b.name}</h2>
            </div>
            <div class="meta">
              ${b.level ? `<span class="badge badge-purple">Ур. ${b.level}</span>` : ''}
              <span class="badge badge-${clsId}">${clsLabel}</span>
            </div>
            ${b.description ? `<div class="description">${b.description}</div>` : ''}
            <div style="margin-top:0.5rem;">
              ${canWrite() ? `
                <button class="btn btn-ghost btn-sm" onclick="openEdit('${b.id}')">✏️ Редактировать</button>
                <button class="btn btn-danger btn-sm" onclick="confirmDelete('${b.id}','${b.name.replace(/'/g,"\\'")}')">🗑️</button>
              ` : ''}
            </div>
          </div>
        </div>
        <div class="boss-detail-items">
          <h4>Предметы (${bItems.length})</h4>
          <div class="item-list">
            ${bItems.length ? bItems.map(item => {
              const slotLabel = SLOTS.find(s => s.id === item.slot)?.label || item.slot || '';
              return `
                <div class="item-row" data-item-id="${item.id}">
                  <img id="detail-item-${item.id}" alt="${item.name}" />
                  <span class="item-name">${item.name}</span>
                  <span class="item-slot">${slotLabel}</span>
                </div>
              `;
            }).join('') : `<span class="text-muted" style="font-size:0.8rem;padding:0.4rem;">Не указаны</span>`}
          </div>
        </div>
      </div>
    `;

    bItems.forEach(item => {
      const img = document.getElementById(`detail-item-${item.id}`);
      if (img) setItemImage(img, item.image);
    });

    document.querySelectorAll('.item-row').forEach(row => {
      const itemId = row.dataset.itemId;
      const item = allItems.find(i => i.id === itemId);
      if (item) {
        row.addEventListener('mouseenter', (e) => showTooltip(e, item));
        row.addEventListener('mouseleave', hideTooltip);
        row.addEventListener('mousemove', moveTooltip);
      }
    });
  }

  function selectBoss(id) {
    selectedBossId = id;
    const b = allBosses.find(x => x.id === id);
    renderList();
    renderDetail(b);
  }

  async function init() {
    [allBosses, allItems] = await Promise.all([getBosses(), getItems()]);
    renderList();
    if (allBosses.length) selectBoss(allBosses[0].id);
  }

  function renderPicker(filter = '') {
    const picker = document.getElementById('items-picker');
    const list = filter
      ? allItems.filter(i => i.name.toLowerCase().includes(filter.toLowerCase()))
      : allItems;

    picker.innerHTML = '';
    list.forEach(item => {
      const row = document.createElement('div');
      row.className = `item-pick-row${selectedItemIds.includes(item.id) ? ' selected' : ''}`;
      const slotLabel = SLOTS.find(s => s.id === item.slot)?.label || item.slot;
      row.innerHTML = `
        <img alt="${item.name}" />
        <div><div style="font-weight:600">${item.name}</div><div style="font-size:0.72rem;color:var(--text-muted)">${slotLabel}</div></div>
        ${selectedItemIds.includes(item.id) ? `<span class="item-pick-check">✓</span>` : ''}
      `;
      setItemImage(row.querySelector('img'), item.image);
      row.addEventListener('click', () => {
        if (selectedItemIds.includes(item.id)) {
          selectedItemIds = selectedItemIds.filter(id => id !== item.id);
        } else {
          selectedItemIds.push(item.id);
        }
        renderPicker(document.getElementById('item-filter').value);
      });
      picker.appendChild(row);
    });
  }

  document.getElementById('item-filter').addEventListener('input', e => renderPicker(e.target.value));

  const modal = document.getElementById('modal');

  function resetForm() {
    document.getElementById('edit-id').value        = '';
    document.getElementById('f-name').value         = '';
    document.getElementById('f-level').value        = '';
    document.getElementById('f-class').value        = '';
    document.getElementById('f-description').value  = '';
    document.getElementById('f-image').value        = '';
    document.getElementById('f-icon').value         = '';
    document.getElementById('item-filter').value    = '';
    document.getElementById('modal-error').style.display = 'none';
    selectedItemIds = [];
    renderPicker();
  }

  function openAdd() {
    document.getElementById('modal-title').textContent = 'Добавить босса';
    resetForm();
    modal.classList.remove('hidden');
  }

  window.openEdit = (id) => {
    const b = allBosses.find(x => x.id === id);
    if (!b) return;
    document.getElementById('modal-title').textContent = 'Редактировать босса';
    resetForm();
    document.getElementById('edit-id').value       = id;
    document.getElementById('f-name').value        = b.name         || '';
    document.getElementById('f-level').value       = b.level        || '';
    document.getElementById('f-class').value       = b.boss_class   || '';
    document.getElementById('f-description').value = b.description  || '';
    document.getElementById('f-image').value       = b.image        || '';
    document.getElementById('f-icon').value        = b.icon         || '';
    selectedItemIds = [...(b.item_ids || [])];
    renderPicker();
    modal.classList.remove('hidden');
  };

  function closeModal() { modal.classList.add('hidden'); }
  document.getElementById('btn-modal-close').onclick = closeModal;
  document.getElementById('btn-cancel').onclick      = closeModal;
  document.getElementById('btn-add-boss').onclick    = openAdd;

  document.getElementById('btn-save').onclick = async () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name) return showError('Введи имя босса');

    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Сохранение...';
    try {
      const data = {
        name,
        level:       document.getElementById('f-level').value.trim(),
        boss_class:  document.getElementById('f-class').value,
        description: document.getElementById('f-description').value.trim(),
        image:       document.getElementById('f-image').value.trim(),
        icon:        document.getElementById('f-icon').value.trim(),
        item_ids:    selectedItemIds,
      };
      const id = document.getElementById('edit-id').value;
      if (id) { await updateBoss(id, data); showToast('Босс обновлён'); }
      else    { await addBoss(data);        showToast('Босс добавлен'); }
      closeModal();
      allBosses = await getBosses();
      renderList();
      if (allBosses.length) {
        const active = allBosses.find(b => b.id === selectedBossId) || allBosses[0];
        selectBoss(active.id);
      } else {
        selectedBossId = null;
        renderDetail(null);
      }
    } catch(e) { showError('Ошибка: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
  };

  window.confirmDelete = (id, name) => {
    if (!confirm(`Удалить босса «${name}»?`)) return;
    deleteBoss(id).then(async () => {
      showToast('Босс удалён');
      allBosses = await getBosses();
      renderList();
      if (allBosses.length) {
        selectBoss(allBosses[0].id);
      } else {
        selectedBossId = null;
        renderDetail(null);
      }
    });
  };

  document.getElementById('filter-search').addEventListener('input', () => {
    renderList();
    const visible = allBosses.filter(b => {
      const search = document.getElementById('filter-search').value.toLowerCase();
      const cls    = document.getElementById('filter-class').value;
      if (search && !b.name.toLowerCase().includes(search)) return false;
      if (cls && b.boss_class !== cls) return false;
      return true;
    });
    if (selectedBossId && !visible.some(b => b.id === selectedBossId)) {
      renderDetail(null);
    } else if (visible.length) {
      const detail = document.getElementById('boss-detail');
      if (!detail.querySelector('.boss-detail-header')) {
        selectBoss(visible[0].id);
      }
    }
  });
  document.getElementById('filter-class').addEventListener('change', () => {
    document.getElementById('filter-search').dispatchEvent(new Event('input'));
  });

  // ── ТУЛТИП как в items.html ──────────────────
  const tooltip = document.getElementById('item-tooltip');
  let tooltipTimeout;

  function showTooltip(e, item) {
    clearTimeout(tooltipTimeout);
    
    // Заполняем данные
    const img = document.getElementById('tooltip-img');
    const name = document.getElementById('tooltip-name');
    const quality = document.getElementById('tooltip-quality');
    const level = document.getElementById('tooltip-level');
    const slot = document.getElementById('tooltip-slot');
    const damageContainer = document.getElementById('tooltip-damage');
    const statsContainer = document.getElementById('tooltip-stats');
    const setBonusContainer = document.getElementById('tooltip-setbonus');
    const effectContainer = document.getElementById('tooltip-effect');
    const propertiesContainer = document.getElementById('tooltip-properties');
    const flavorContainer = document.getElementById('tooltip-flavor');
    const bossContainer = document.getElementById('tooltip-boss');

    setItemImage(img, item.image);
    name.textContent = item.name || 'Без названия';

    const qualityLabel = QUALITY.find(q => q.id === item.quality)?.label || item.quality || 'Обычное';
    quality.textContent = qualityLabel;
    level.textContent = item.level ? `Уровень ${item.level}` : '';
    const slotLabel = SLOTS.find(s => s.id === item.slot)?.label || item.slot || '—';
    slot.textContent = slotLabel;

    // Урон/Защита
    if (item.damage_min || item.damage_max) {
      const label = getDamageLabel(item.slot);
      damageContainer.innerHTML = `
        <div class="fc-damage">
          <span class="damage-label">${label}:</span>
          ${item.damage_min || 0}${item.damage_max ? ` ~ ${item.damage_max}` : ''}
        </div>
      `;
    } else {
      damageContainer.innerHTML = '';
    }

    // Статы
    statsContainer.innerHTML = '';
    if (item.stats && item.stats.length) {
      const statsDiv = document.createElement('div');
      statsDiv.className = 'fc-stats';
      
      let statEntries = [];
      if (typeof item.stats === 'object' && !Array.isArray(item.stats)) {
        Object.entries(item.stats).forEach(([key, value]) => {
          if (value !== null && value !== undefined && value !== '') {
            statEntries.push({ label: key, value });
          }
        });
      } else if (Array.isArray(item.stats)) {
        item.stats.forEach(stat => {
          if (typeof stat === 'object') {
            statEntries.push({ label: stat.label || stat.name || 'Свойство', value: stat.value || stat.val || '' });
          }
        });
      }

      statEntries.forEach(({ label, value }) => {
        const div = document.createElement('div');
        div.className = 'stat';
        div.innerHTML = `
          <span class="stat-label">${label}</span>
          <span class="stat-value">${value}</span>
        `;
        statsDiv.appendChild(div);
      });
      
      if (statEntries.length) statsContainer.appendChild(statsDiv);
    }

    // Сетовый бонус
    setBonusContainer.innerHTML = '';
    if (item.set_bonus && item.set_bonus.name) {
      const setDiv = document.createElement('div');
      setDiv.className = 'fc-set-bonus';
      let html = `<div class="set-name">${item.set_bonus.name}</div><div class="set-pieces">`;
      if (item.set_bonus.piece2) html += `<div class="set-piece"><span class="pieces-label">(2):</span> ${item.set_bonus.piece2}</div>`;
      if (item.set_bonus.piece4) html += `<div class="set-piece"><span class="pieces-label">(4):</span> ${item.set_bonus.piece4}</div>`;
      html += '</div>';
      setDiv.innerHTML = html;
      setBonusContainer.appendChild(setDiv);
    }

    // Эффект
    effectContainer.innerHTML = '';
    if (item.effect && (item.effect.name || item.effect.desc)) {
      const effectDiv = document.createElement('div');
      effectDiv.className = 'fc-effect';
      let html = '';
      if (item.effect.image) {
        html += `<img class="effect-icon" src="${item.effect.image}" alt="effect" />`;
      }
      html += `<div class="effect-info">`;
      if (item.effect.name) html += `<div class="effect-name">${item.effect.name}</div>`;
      if (item.effect.desc) html += `<div class="effect-desc">${item.effect.desc}</div>`;
      html += `</div>`;
      effectDiv.innerHTML = html;
      effectContainer.appendChild(effectDiv);
    }

    // Возможные свойства
    propertiesContainer.innerHTML = '';
    if (item.properties && item.properties.length) {
      const propsDiv = document.createElement('div');
      propsDiv.className = 'fc-properties';
      let html = `<div class="prop-label">Возможные свойства</div><div class="prop-list">`;
      item.properties.forEach(prop => {
        html += `<span class="prop-tag">${prop}</span>`;
      });
      html += '</div>';
      propsDiv.innerHTML = html;
      propertiesContainer.appendChild(propsDiv);
    }

    // Флейвор
    flavorContainer.innerHTML = '';
    if (item.description) {
      const flavorDiv = document.createElement('div');
      flavorDiv.className = 'fc-flavor';
      flavorDiv.textContent = item.description;
      flavorContainer.appendChild(flavorDiv);
    }

    // Босс с иконкой
    bossContainer.innerHTML = '';
    const boss = allBosses.find(b => b.id === item.boss_id);
    if (boss) {
      const bossDiv = document.createElement('div');
      bossDiv.className = 'fc-boss';
      const bossIcon = boss.icon ? `/assets/img/bosses/${boss.icon}` : '';
      bossDiv.innerHTML = `
        ${bossIcon ? `<img class="boss-icon" src="${bossIcon}" alt="${boss.name}" onerror="this.classList.add('error')" />` : '<span style="font-size:1.2rem;">👹</span>'}
        <span class="boss-name">${boss.name}</span>
      `;
      bossContainer.appendChild(bossDiv);
    }

    tooltip.classList.add('visible');
    requestAnimationFrame(() => moveTooltip(e));
  }

  function moveTooltip(e) {
    const padding = 15;
    let x = e.clientX + padding;
    let y = e.clientY;

    const rect = tooltip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth) {
      x = e.clientX - rect.width - padding;
    }
    if (y + rect.height > window.innerHeight) {
      y = window.innerHeight - rect.height - padding;
    }
    if (x < padding) x = padding;
    if (y < padding) y = padding;

    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }

  function hideTooltip() {
    tooltipTimeout = setTimeout(() => {
      tooltip.classList.remove('visible');
    }, 100);
  }

  function showError(msg) { const el = document.getElementById('modal-error'); el.textContent = msg; el.style.display = 'block'; }
  function showToast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
  }

  if (canWrite()) {
    document.getElementById('btn-add-boss').classList.remove('hidden');
  }

  init();
</script>
</body>
</html>
