<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — TL Loot</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .login-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-error {
      color: #dc3545;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

<nav class="navbar" id="main-nav"></nav>

<main class="container">
  <div class="login-container">
    <h2>🔑 Вход в систему</h2>
    
    <div id="login-error" class="login-error"></div>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@guild.com" />
    </div>
    
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••" />
    </div>
    
    <button class="btn btn-primary" id="btn-login" style="width:100%">
      Войти
    </button>
    
    <div style="margin-top:1rem;text-align:center;font-size:0.85rem;color:var(--text-muted)">
      Только для модераторов и администраторов
    </div>
  </div>
</main>

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { initAuth, login, authReady, currentUser, currentRole } from "../js/modules/auth.js";
  
  initNavbar();
  initAuth();
  
  // Если уже авторизован - перенаправляем
  authReady.then(({ user, role }) => {
    if (user && (role === 'admin' || role === 'moderator')) {
      window.location.href = 'admin.html';
    }
  });
  
  document.getElementById("btn-login").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("login-error");
    
    if (!email || !password) {
      errorEl.textContent = "Заполните все поля";
      errorEl.style.display = "block";
      return;
    }
    
    const btn = document.getElementById("btn-login");
    btn.disabled = true;
    btn.textContent = "Вход...";
    
    try {
      await login(email, password);
      // Ждем обновления роли
      setTimeout(() => {
        if (currentRole === 'admin' || currentRole === 'moderator') {
          window.location.href = 'admin.html';
        } else {
          errorEl.textContent = "У вас нет прав администратора";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Войти";
        }
      }, 1000);
    } catch (e) {
      let msg = "Ошибка входа";
      if (e.code === "auth/user-not-found") msg = "Пользователь не найден";
      if (e.code === "auth/wrong-password") msg = "Неверный пароль";
      if (e.code === "auth/invalid-email") msg = "Некорректный email";
      errorEl.textContent = msg;
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Войти";
    }
  });
  
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      document.getElementById("btn-login").click();
    }
  });
</script>
</body>
</html>
