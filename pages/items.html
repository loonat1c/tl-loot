<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Предметы — TL Loot</title>

  <link rel="stylesheet" href="../css/main.css" />

  <style>
    /* ══════════════════════════════════════════════════
       ПЕРЕМЕННЫЕ СТРАНИЦЫ
    ══════════════════════════════════════════════════ */
    :root {
      --gold:        #c9aa71;
      --gold-soft:   #e2c98a;
      --gold-dim:    #8a6f3e;
      --gold-glow:   rgba(201,170,113,0.18);
      --gold-border: rgba(201,170,113,0.28);
      --epic:        #a855f7;
      --epic-glow:   rgba(168,85,247,0.22);
      --epic2:       #8b5cf6;
    }

    /* ══════════════════════════════════════════════════
       ФИЛЬТРЫ
    ══════════════════════════════════════════════════ */
    .filter-bar {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .filter-bar input {
      max-width: 200px;
      background: var(--bg-card2);
      border-color: var(--border);
      font-size: 0.85rem;
      height: 34px;
      padding: 0 0.75rem;
    }

    .filter-bar select {
      width: auto;
      background: var(--bg-card2);
      border-color: var(--border);
      font-size: 0.85rem;
      height: 34px;
      padding: 0 0.5rem;
    }

    .filter-bar input:focus,
    .filter-bar select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold-glow);
    }

    /* ══════════════════════════════════════════════════
       СЕТКА
    ══════════════════════════════════════════════════ */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    /* ══════════════════════════════════════════════════
       КАРТОЧКА ПРЕДМЕТА
    ══════════════════════════════════════════════════ */
    .item-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      min-height: 100px;
      overflow: visible;
    }

    .item-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      background: linear-gradient(135deg, var(--gold-glow) 0%, transparent 60%);
    }

    .item-card:hover {
      border-color: var(--gold-border);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--gold-border);
      z-index: 10;
    }

    .item-card:hover::before { opacity: 1; }

    /* Полосы качества слева */
    .item-card.quality-epic {
      border-left: 3px solid var(--epic);
      box-shadow: inset 4px 0 12px rgba(168,85,247,0.12);
    }

    .item-card.quality-epic_ii {
      border-left: 3px solid var(--epic2);
      box-shadow: inset 4px 0 12px rgba(139,92,246,0.15);
    }

    .item-card.quality-epic:hover,
    .item-card.quality-epic_ii:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--gold-border), inset 4px 0 16px rgba(168,85,247,0.2);
    }

    /* ── Картинка предмета ── */
    .item-img-wrap {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      position: relative;
    }

    .item-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 7px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      pointer-events: none;
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Скрываем обёртку если нет картинки */
    .item-img-wrap:has(img:not([src])),
    .item-img-wrap:has(img[src=""]),
    .item-img-wrap:has(img[src="#"]) {
      display: none;
    }

    /* Заглушка без картинки */
    .item-img-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    /* ── Текст карточки ── */
    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .item-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.3;
      font-family: 'HeaderFont', var(--font);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-card.quality-epic    .item-name { color: #c4b5fd; }
    .item-card.quality-epic_ii .item-name { color: #a78bfa; }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .slot-badge {
      font-size: 0.62rem;
      color: var(--gold);
      background: rgba(201,170,113,0.1);
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--gold-border);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .weapon-type-badge {
      font-size: 0.6rem;
      color: var(--text-muted);
      background: var(--bg-card2);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .boss-tag {
      font-size: 0.62rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .boss-icon-small {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-card2);
    }

    .item-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.7;
      font-style: italic;
    }

    /* ── Кнопки редактирования ── */
    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .item-actions .btn {
      padding: 0.2rem 0.45rem;
      font-size: 0.7rem;
      line-height: 1.4;
    }

    /* ══════════════════════════════════════════════════
       ПОЛНАЯ КАРТОЧКА (тултип при наведении)
    ══════════════════════════════════════════════════ */
    .full-card {
      display: none;
      position: absolute;
      left: calc(100% + 14px);
      right: auto;
      top: 0;
      width: 420px;
      max-width: 80vw;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 12px 48px rgba(0,0,0,0.85), 0 0 0 1px rgba(201,170,113,0.1);
      z-index: 1000;
      pointer-events: none;
    }

    /* Декоративный угол */
    .full-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .item-card:nth-child(3n) .full-card {
      left: auto;
      right: calc(100% + 14px);
    }

    .item-card:hover .full-card { display: block; }

    .full-card::-webkit-scrollbar { width: 4px; }
    .full-card::-webkit-scrollbar-track { background: var(--bg-card2); border-radius: 4px; }
    .full-card::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }

    /* ── Шапка полной карточки ── */
    .fc-header {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.75rem;
      align-items: flex-start;
    }

    .fc-img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-card2);
      flex-shrink: 0;
      border: 1px solid var(--gold-border);
    }

    .fc-title { flex: 1; min-width: 0; }

    .fc-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-soft);
      font-family: 'HeaderFont', var(--font);
      line-height: 1.3;
      text-shadow: 0 0 16px rgba(201,170,113,0.3);
    }

    .fc-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
      margin-top: 5px;
    }

    .fc-quality {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .fc-quality.epic-label { color: #c4b5fd; }

    .fc-level {
      font-size: 0.68rem;
      color: var(--gold-dim);
      background: rgba(201,170,113,0.08);
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--gold-border);
    }

    /* ── Урон/Защита ── */
    .fc-damage {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-soft);
      padding: 0.45rem 0.6rem;
      background: rgba(201,170,113,0.07);
      border-radius: var(--radius-sm);
      border: 1px solid var(--gold-border);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .damage-label {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    /* ── Характеристики ── */
    .fc-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.2rem 1rem;
      margin: 0.5rem 0;
      padding: 0.5rem 0.6rem;
      background: var(--bg-card2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .stat {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .stat-label { color: var(--text-muted); }
    .stat-value { color: var(--gold-soft); font-weight: 600; }

    /* ── Сетовый бонус ── */
    .fc-set-bonus {
      margin: 0.5rem 0;
      padding: 0.55rem 0.75rem;
      background: rgba(201,170,113,0.06);
      border-radius: var(--radius-sm);
      border: 1px solid var(--gold-border);
    }

    .set-name {
      font-weight: 700;
      color: var(--gold);
      font-size: 0.88rem;
      font-family: 'HeaderFont', var(--font);
    }

    .set-pieces { display: flex; flex-direction: column; gap: 0.2rem; margin-top: 0.3rem; }

    .set-piece {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .pieces-label {
      color: var(--gold-dim);
      font-weight: 600;
      margin-right: 0.3rem;
    }

    /* ── Эффект ── */
    .fc-effect {
      display: flex;
      gap: 0.75rem;
      margin: 0.6rem 0;
      padding: 0.65rem 0.75rem;
      background: rgba(168,85,247,0.07);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .effect-icon {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg-card2);
      flex-shrink: 0;
    }

    .effect-info { flex: 1; font-size: 0.8rem; }
    .effect-name { font-weight: 600; color: #c4b5fd; margin-bottom: 2px; }
    .effect-desc { color: var(--text-muted); }

    /* ── Свойства ── */
    .fc-properties {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
    }

    .prop-label {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .prop-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }

    .prop-tag {
      background: var(--bg-card2);
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
      font-size: 0.68rem;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* ── Флейвор / Описание ── */
    .fc-flavor {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    /* ── Босс ── */
    .fc-boss {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .fc-boss .boss-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-card2);
      border: 1px solid var(--gold-border);
      flex-shrink: 0;
    }

    .fc-boss .boss-name { color: var(--gold-dim); font-weight: 500; }

    /* ══════════════════════════════════════════════════
       МОБИЛЬНЫЙ ТУЛТИП
    ══════════════════════════════════════════════════ */
    @media (max-width: 992px) {
      .item-card .full-card {
        position: fixed;
        left: 50%;
        right: auto;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 440px;
        max-width: 92vw;
        max-height: 80vh;
      }
    }

    /* ══════════════════════════════════════════════════
       ПЛАНШЕТЫ
    ══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .items-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .item-card:nth-child(2n) .full-card {
        left: auto;
        right: calc(100% + 12px);
      }

      .item-card:nth-child(3n) .full-card {
        left: calc(100% + 12px);
        right: auto;
      }

      .fc-stats { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .items-grid { grid-template-columns: 1fr; }
      .item-card .full-card {
        left: calc(100% + 12px);
        right: auto;
      }
    }

    /* ══════════════════════════════════════════════════
       МОДАЛЬНОЕ ОКНО
    ══════════════════════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--gold-soft);
      font-family: 'HeaderFont', var(--font);
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .btn-close:hover {
      background: var(--bg-card2);
      color: var(--text);
    }

    /* ── Секции формы ── */
    .form-section {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .form-section:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--gold-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .form-row .form-group { margin-bottom: 0; }

    /* ── Загрузка картинки ── */
    .image-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--bg-card2);
    }

    .image-upload-area:hover {
      border-color: var(--gold-border);
      background: rgba(201,170,113,0.04);
    }

    .image-preview {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      margin: 0 auto 0.3rem;
      display: block;
    }

    .upload-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .image-upload-area.small { padding: 0.4rem; }
    .image-upload-area.small .image-preview { width: 48px; height: 48px; }
    .image-upload-area.small .upload-hint { font-size: 0.6rem; }

    /* ── Динамические поля ── */
    .dynamic-fields { margin-top: 0.25rem; }

    .field-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.3rem;
      background: var(--bg-card2);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      transition: border-color 0.15s;
    }

    .field-row:hover { border-color: var(--gold-border); }

    .field-row input {
      padding: 0.3rem 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.85rem;
      transition: border-color 0.15s;
    }

    .field-row input:focus {
      outline: none;
      border-color: var(--gold-border);
    }

    .field-label-input { flex: 2; }
    .field-value-input { flex: 1; }

    .btn-remove-field {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.1rem 0.3rem;
      line-height: 1;
      border-radius: 4px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-remove-field:hover { background: rgba(239,68,68,0.15); }

    .field-single .field-label-input { flex: 1; }
    .field-single .field-value-input { display: none; }

    .btn-add-field {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      margin-top: 0.3rem;
      background: var(--bg-card2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      height: 30px;
    }

    .btn-add-field:hover {
      border-color: var(--gold-border);
      color: var(--gold);
    }

    .btn-add-field .icon { font-size: 0.9rem; line-height: 1; }

    /* ── Кнопки формы ── */
    .form-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .form-actions .btn { min-width: 120px; }

    .modal .form-group textarea { min-height: 80px; resize: vertical; }

    /* ── Урон в форме ── */
    .damage-inputs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .damage-inputs input { width: 80px; text-align: center; }
    .damage-inputs span { color: var(--text-muted); font-size: 0.9rem; }

    /* ── Сетовый бонус тумблер ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .toggle-label { font-size: 0.85rem; color: var(--text-muted); }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .toggle-switch .slider {
      position: absolute;
      inset: 0;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    .toggle-switch .slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle-switch input:checked + .slider {
      background: var(--gold-dim);
      border-color: var(--gold-dim);
    }

    .toggle-switch input:checked + .slider::before {
      transform: translateX(20px);
      background: var(--gold);
    }

    .set-bonus-fields {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: var(--bg-card2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--gold-border);
      display: none;
    }

    .set-bonus-fields.visible { display: block; }

    .field-hidden { display: none !important; }

    /* ── Ошибка ── */
    #modal-error {
      font-size: 0.85rem;
    }

    /* ── Утилиты ── */
    .hidden { display: none !important; }

    /* ══════════════════════════════════════════════════
       АДАПТИВ МОДАЛКИ
    ══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .modal { padding: 1rem; }
      .form-row { grid-template-columns: 1fr; }
      .field-row { flex-wrap: wrap; }
      .field-label-input { flex: 1 1 100%; }
      .field-value-input { flex: 1 1 100%; }
      .form-actions { flex-direction: column; }
      .form-actions .btn { width: 100%; min-width: unset; }
      .damage-inputs { flex-wrap: wrap; }
      .toggle-wrap { flex-wrap: wrap; }
    }
  </style>
</head>

<body>

<nav class="navbar" id="main-nav"></nav>

<main class="container">

  <div class="page-header">
    <h2>🗡️ Предметы</h2>
    <button class="btn btn-primary hidden" id="btn-add-item">
      + Добавить предмет
    </button>
  </div>

  <div class="filter-bar">
    <input type="text" id="filter-search" placeholder="🔍 Поиск по названию..." />
    <select id="filter-slot"><option value="">Все слоты</option></select>
    <select id="filter-quality"><option value="">Все качества</option></select>
    <select id="filter-boss"><option value="">Все боссы</option></select>
  </div>

  <div id="items-grid" class="items-grid">
    <div class="text-muted">Загрузка...</div>
  </div>

</main>

<!-- ══════════════════════════════════════════════════
     МОДАЛЬНОЕ ОКНО
══════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Добавить предмет</h3>
      <button class="btn-close" id="btn-modal-close">✕</button>
    </div>

    <input type="hidden" id="edit-id" />

    <div class="form-section">
      <div class="section-title">Основная информация</div>

      <div class="form-row">
        <div class="form-group">
          <label>Название *</label>
          <input type="text" id="f-name" placeholder="Например: Шлем Тени" />
        </div>
        <div class="form-group">
          <label>Слот *</label>
          <select id="f-slot">
            <option value="">— выбери слот —</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Качество</label>
          <select id="f-quality">
            <option value="epic">🟣 Эпическое</option>
            <option value="epic_ii">🟣 Эпическое II</option>
          </select>
        </div>
        <div class="form-group">
          <label>Уровень предмета</label>
          <input type="number" id="f-level" placeholder="12" min="1" max="99" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Босс *</label>
          <select id="f-boss">
            <option value="">— выбери босса —</option>
          </select>
        </div>
        <div class="form-group" id="weapon-type-group">
          <label>Тип оружия</label>
          <select id="f-weapon-type">
            <option value="">— не выбрано —</option>
            <option value="bow">🏹 Лук</option>
            <option value="staff">🪄 Посох</option>
            <option value="twohand_sword">⚔️ Двуручный меч</option>
            <option value="crossbow">🎯 Арбалеты</option>
            <option value="wand">✨ Жезл</option>
            <option value="daggers">🗡️ Кинжалы</option>
            <option value="sword_shield">🛡️ Щит и меч</option>
            <option value="spear">🔱 Копье</option>
          </select>
        </div>
      </div>

      <div class="form-row" id="damage-row">
        <div class="form-group" id="damage-min-group">
          <label id="damage-min-label">Урон (мин)</label>
          <input type="number" id="f-damage-min" placeholder="15" min="0" step="1" />
        </div>
        <div class="form-group" id="damage-max-group">
          <label id="damage-max-label">Урон (макс)</label>
          <input type="number" id="f-damage-max" placeholder="155" min="0" step="1" />
        </div>
      </div>

      <div class="form-group">
        <label>Картинка</label>
        <div class="image-upload-area" id="upload-area">
          <img id="img-preview" class="image-preview hidden" alt="preview" />
          <div class="upload-hint" id="upload-hint">Нажми чтобы выбрать картинку<br><small>Сожмётся до 128×128</small></div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Описание</div>
      <div class="form-group">
        <label>Описание / Флейвор</label>
        <textarea id="f-description" rows="4" placeholder="Полное описание предмета, цитата, история..."></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Характеристики</div>
      <div class="dynamic-fields" id="stats-fields"></div>
      <button class="btn-add-field" data-target="stats">
        <span class="icon">+</span> Добавить характеристику
      </button>
    </div>

    <div class="form-section" id="effect-section">
      <div class="section-title">Эффект</div>

      <div class="form-row">
        <div class="form-group">
          <label>Название эффекта</label>
          <input type="text" id="f-effect-name" placeholder="Например: Глубинное пламя" />
        </div>
        <div class="form-group">
          <label>Картинка эффекта</label>
          <div class="image-upload-area small" id="effect-upload-area">
            <img id="effect-preview" class="image-preview hidden" alt="effect" />
            <div class="upload-hint" id="effect-upload-hint">Нажми чтобы выбрать</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Описание эффекта</label>
        <input type="text" id="f-effect-desc" placeholder="Описание эффекта..." />
      </div>
    </div>

    <div class="form-section" id="set-bonus-section" style="display:none;">
      <div class="section-title">Сетовый бонус</div>

      <div class="toggle-wrap">
        <span class="toggle-label">Включить сетовый бонус</span>
        <label class="toggle-switch">
          <input type="checkbox" id="f-set-bonus-toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="set-bonus-fields" id="set-bonus-fields">
        <div class="form-group">
          <label>Название бонуса</label>
          <input type="text" id="f-set-name" placeholder="Например: Доспехи Дайгона" />
        </div>
        <div class="form-group">
          <label>Эффект за 2 предмета</label>
          <input type="text" id="f-set-2" placeholder="Урон +5%" />
        </div>
        <div class="form-group">
          <label>Эффект за 4 предмета</label>
          <input type="text" id="f-set-4" placeholder="Защита +10%" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Возможные свойства</div>
      <div class="dynamic-fields" id="properties-fields"></div>
      <button class="btn-add-field" data-target="properties">
        <span class="icon">+</span> Добавить свойство
      </button>
    </div>

    <div id="modal-error" class="text-danger mt-1" style="display:none; font-size:0.85rem;"></div>

    <div class="form-actions">
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
      <button class="btn btn-ghost" id="btn-cancel">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { initAuth, authReady, isAdmin, currentRole, currentUser } from "../js/modules/auth.js";
  import { getItems, addItem, updateItem, deleteItem } from "../js/modules/items.js";
  import { getBosses } from "../js/modules/bosses.js";
  import { compressImage, pickFile, setItemImage } from "../js/modules/images.js";
  import { SLOTS, QUALITY } from "../js/constants.js";

  initNavbar();

  await initAuth();
  await authReady;

  // ── Кнопка только для админа ──────────────────────
  const addBtn = document.getElementById('btn-add-item');
  if (isAdmin()) {
    addBtn.classList.remove('hidden');
    addBtn.onclick = openAdd;
  }

  // ── Слоты и качества в фильтрах и форме ──────────
  const slotSelect = document.getElementById("f-slot");
  const filterSlot = document.getElementById("filter-slot");
  SLOTS.forEach(slot => {
    slotSelect.innerHTML += `<option value="${slot.id}">${slot.label}</option>`;
    filterSlot.innerHTML += `<option value="${slot.id}">${slot.label}</option>`;
  });

  const filterQuality = document.getElementById("filter-quality");
  QUALITY.forEach(q => {
    filterQuality.innerHTML += `<option value="${q.id}">${q.label}</option>`;
  });

  // ── Боссы ─────────────────────────────────────────
  let allBosses = [];

  async function loadBosses() {
    try {
      allBosses = await getBosses();
      populateBossSelects();
    } catch (error) {
      console.error('Ошибка загрузки боссов:', error);
      allBosses = [];
    }
  }

  function populateBossSelects() {
    const bossSelect = document.getElementById('f-boss');
    const filterBoss = document.getElementById('filter-boss');
    const currentValue = bossSelect.value;
    const filterValue = filterBoss.value;
    bossSelect.innerHTML = `<option value="">— выбери босса —</option>`;
    filterBoss.innerHTML = `<option value="">Все боссы</option>`;
    allBosses.forEach(boss => {
      bossSelect.innerHTML += `<option value="${boss.id}">${boss.name}</option>`;
      filterBoss.innerHTML += `<option value="${boss.id}">${boss.name}</option>`;
    });
    if (currentValue) bossSelect.value = currentValue;
    if (filterValue) filterBoss.value = filterValue;
  }

  // ── Поля по слоту ─────────────────────────────────
  const weaponTypeGroup  = document.getElementById('weapon-type-group');
  const damageMinGroup   = document.getElementById('damage-min-group');
  const damageMaxGroup   = document.getElementById('damage-max-group');
  const damageMinLabel   = document.getElementById('damage-min-label');
  const damageMaxLabel   = document.getElementById('damage-max-label');
  const effectSection    = document.getElementById('effect-section');
  const setBonusSection  = document.getElementById('set-bonus-section');
  const setBonusToggle   = document.getElementById('f-set-bonus-toggle');
  const setBonusFields   = document.getElementById('set-bonus-fields');

  const armorSlots     = ['helmet','cloak','chest','gloves','pants','boots'];
  const accessorySlots = ['necklace','belt','ring','bracelet'];
  const weaponSlot     = 'weapon';

  function updateFieldsBySlot(slotId) {
    const isWeapon    = slotId === weaponSlot;
    const isArmor     = armorSlots.includes(slotId);
    const isAccessory = accessorySlots.includes(slotId);

    weaponTypeGroup.style.display = isWeapon ? 'block' : 'none';

    if (isWeapon) {
      damageMinGroup.style.display = 'block';
      damageMaxGroup.style.display = 'block';
      damageMinLabel.textContent = 'Урон (мин)';
      damageMaxLabel.textContent = 'Урон (макс)';
    } else if (isArmor) {
      damageMinGroup.style.display = 'block';
      damageMaxGroup.style.display = 'block';
      damageMinLabel.textContent = 'Защита (ближний бой)';
      damageMaxLabel.textContent = 'Защита (дальний бой)';
    } else if (isAccessory) {
      damageMinGroup.style.display = 'block';
      damageMaxGroup.style.display = 'none';
      damageMinLabel.textContent = 'Защита (магия)';
    } else {
      damageMinGroup.style.display = 'none';
      damageMaxGroup.style.display = 'none';
    }

    effectSection.style.display   = isWeapon ? 'block' : 'none';
    setBonusSection.style.display  = isWeapon ? 'none' : 'block';

    if (!isWeapon) {
      setBonusToggle.checked = false;
      setBonusFields.classList.remove('visible');
    }
  }

  slotSelect.addEventListener('change', function() {
    updateFieldsBySlot(this.value);
  });

  setBonusToggle.addEventListener('change', function() {
    setBonusFields.classList.toggle('visible', this.checked);
  });

  // ── Динамические поля ─────────────────────────────
  function addField(containerId, type = 'pair') {
    const container = document.getElementById(containerId);
    if (!container) return;
    const row = document.createElement('div');
    row.className = `field-row ${type === 'single' ? 'field-single' : ''}`;
    if (type === 'single') {
      row.innerHTML = `
        <input type="text" placeholder="Введите свойство..." class="field-label-input" />
        <button class="btn-remove-field" onclick="this.parentElement.remove()">✕</button>
      `;
    } else {
      row.innerHTML = `
        <input type="text" placeholder="Название" class="field-label-input" />
        <input type="text" placeholder="Значение" class="field-value-input" />
        <button class="btn-remove-field" onclick="this.parentElement.remove()">✕</button>
      `;
    }
    container.appendChild(row);
    const firstInput = row.querySelector('input');
    if (firstInput) setTimeout(() => firstInput.focus(), 50);
  }

  function getFields(containerId, type = 'pair') {
    const container = document.getElementById(containerId);
    if (!container) return [];
    const rows = container.querySelectorAll('.field-row');
    const result = [];
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      if (type === 'single') {
        const val = inputs[0]?.value.trim();
        if (val) result.push(val);
      } else {
        const label = inputs[0]?.value.trim() || '';
        const value = inputs[1]?.value.trim() || '';
        if (label || value) result.push({ label, value });
      }
    });
    return result;
  }

  function setFields(containerId, data, type = 'pair') {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    if (type === 'single') {
      data.forEach(val => {
        const row = document.createElement('div');
        row.className = 'field-row field-single';
        row.innerHTML = `
          <input type="text" placeholder="Введите свойство..." class="field-label-input" value="${val}" />
          <button class="btn-remove-field" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(row);
      });
    } else {
      data.forEach(item => {
        const row = document.createElement('div');
        row.className = 'field-row';
        row.innerHTML = `
          <input type="text" placeholder="Название" class="field-label-input" value="${item.label || ''}" />
          <input type="text" placeholder="Значение" class="field-value-input" value="${item.value || ''}" />
          <button class="btn-remove-field" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(row);
      });
    }
  }

  document.querySelectorAll('.btn-add-field').forEach(btn => {
    btn.addEventListener('click', function() {
      const target = this.dataset.target;
      if (target === 'properties') {
        addField('properties-fields', 'single');
      } else {
        addField(`${target}-fields`, 'pair');
      }
    });
  });

  ['stats-fields', 'properties-fields'].forEach(id => {
    document.getElementById(id).innerHTML = '';
  });

  // ── Картинка эффекта ──────────────────────────────
  let currentEffectImage = null;

  document.getElementById('effect-upload-area').addEventListener('click', async () => {
    const file = await pickFile();
    if (!file) return;
    const base64 = await compressImage(file);
    currentEffectImage = base64;
    const preview = document.getElementById('effect-preview');
    preview.src = base64;
    preview.classList.remove('hidden');
    document.getElementById('effect-upload-hint').style.display = 'none';
  });

  // ── Данные ────────────────────────────────────────
  let allItems = [];
  let currentImageBase64 = null;

  async function loadItems() {
    try {
      allItems = await getItems();
      populateBossFilter();
      renderItems();
    } catch (error) {
      console.error("Ошибка загрузки предметов:", error);
      document.getElementById("items-grid").innerHTML = `<div class="text-danger">Не удалось загрузить предметы</div>`;
    }
  }

  function populateBossFilter() {
    const bossIds = [...new Set(allItems.map(item => item.boss_id).filter(Boolean))];
    const bossNames = [];
    bossIds.forEach(id => {
      const boss = allBosses.find(b => b.id === id);
      if (boss) bossNames.push({ id: boss.id, name: boss.name });
    });
    bossNames.sort((a, b) => a.name.localeCompare(b.name));
    const select = document.getElementById("filter-boss");
    const currentValue = select.value;
    select.innerHTML = `<option value="">Все боссы</option>`;
    bossNames.forEach(boss => {
      select.innerHTML += `<option value="${boss.id}">${boss.name}</option>`;
    });
    if (currentValue) select.value = currentValue;
  }

  function renderItems() {
    const search  = document.getElementById("filter-search").value.toLowerCase();
    const slot    = document.getElementById("filter-slot").value;
    const quality = document.getElementById("filter-quality").value;
    const bossId  = document.getElementById("filter-boss").value;

    const list = allItems.filter(item => {
      if (search && !item.name?.toLowerCase().includes(search) && !item.boss_name?.toLowerCase().includes(search)) return false;
      if (slot    && item.slot    !== slot)    return false;
      if (quality && item.quality !== quality) return false;
      if (bossId  && item.boss_id !== bossId)  return false;
      return true;
    });

    const grid = document.getElementById("items-grid");
    if (!list.length) {
      grid.innerHTML = `<div class="text-muted">Предметов не найдено</div>`;
      return;
    }

    grid.innerHTML = "";
    list.forEach(item => grid.appendChild(buildCard(item)));
  }

  // ── Вспомогательные ───────────────────────────────
  function getWeaponTypeLabel(type) {
    const types = {
      'bow':'🏹 Лук','staff':'🪄 Посох','twohand_sword':'⚔️ Двуручный меч',
      'crossbow':'🎯 Арбалеты','wand':'✨ Жезл','daggers':'🗡️ Кинжалы',
      'sword_shield':'🛡️ Щит и меч','spear':'🔱 Копье'
    };
    return types[type] || type;
  }

  function getBossName(bossId) {
    return allBosses.find(b => b.id === bossId)?.name || '—';
  }

  function getBossIcon(bossId) {
    const boss = allBosses.find(b => b.id === bossId);
    return boss?.icon ? `/assets/img/bosses/${boss.icon}` : null;
  }

  function getQualityLabel(quality) {
    return QUALITY.find(q => q.id === quality)?.label || quality;
  }

  function getSlotEmoji(slotId) {
    const map = {
      helmet:'🪖', cloak:'🧥', chest:'🛡️', gloves:'🧤', pants:'👖', boots:'👢',
      necklace:'📿', belt:'🔗', ring:'💍', bracelet:'⌚', weapon:'⚔️'
    };
    return map[slotId] || '🎒';
  }

  function getDamageLabel(slotId) {
    if (slotId === 'weapon') return '🗡️ Урон';
    if (['helmet','cloak','chest','gloves','pants','boots'].includes(slotId)) return '🛡️ Защита';
    if (['necklace','belt','ring','bracelet'].includes(slotId)) return '🛡️ Защ. (магия)';
    return '';
  }

  // ── Сборка карточки ───────────────────────────────
  function buildCard(item) {
    const slotLabel  = SLOTS.find(s => s.id === item.slot)?.label || item.slot;
    const canEdit    = isAdmin();

    const stats      = item.stats      || [];
    const effect     = item.effect     || {};
    const setBonus   = item.set_bonus  || {};
    const properties = item.properties || [];
    const desc       = item.description || '';
    const level      = item.level      || '';
    const damageMin  = item.damage_min || '';
    const damageMax  = item.damage_max || '';
    const isWeapon   = item.slot === 'weapon';
    const bossName   = getBossName(item.boss_id);
    const bossIcon   = getBossIcon(item.boss_id);
    const qualityLabel = getQualityLabel(item.quality);
    const hasImage   = item.image && item.image !== '';
    const slotEmoji  = getSlotEmoji(item.slot);

    const card = document.createElement("div");
    card.className = `item-card quality-${item.quality || "epic"}`;

    const shortName = item.name && item.name.length > 22
      ? item.name.substring(0, 22) + '…'
      : item.name;

    card.innerHTML = `
      ${hasImage
        ? `<div class="item-img-wrap">
             <img class="item-img" id="img-${item.id}" alt="${item.name || 'Предмет'}" src="${item.image}" onerror="this.parentElement.style.display='none'" />
           </div>`
        : `<div class="item-img-placeholder">${slotEmoji}</div>`
      }

      <div class="item-info">
        <div class="item-name" title="${item.name || 'Без названия'}">${shortName || 'Без названия'}</div>
        <div class="item-meta">
          <span class="slot-badge">${slotLabel}</span>
          <span class="boss-tag">
            ${bossIcon
              ? `<img class="boss-icon-small" src="${bossIcon}" alt="${bossName}" onerror="this.style.display='none'" />`
              : '👹'}
            ${bossName}
          </span>
          ${item.slot === 'weapon' && item.weapon_type
            ? `<span class="weapon-type-badge">${getWeaponTypeLabel(item.weapon_type)}</span>`
            : ''}
        </div>
        ${desc ? `<div class="item-desc">${desc}</div>` : ''}
      </div>

      ${canEdit ? `
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${item.id}')" title="Редактировать">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete('${item.id}','${String(item.name || '').replace(/'/g, "\\'")}')" title="Удалить">🗑️</button>
        </div>
      ` : ''}

      <!-- ТУЛТИП -->
      <div class="full-card">
        <div class="fc-header">
          <img class="fc-img" src="${item.image || ''}" alt="${item.name}" onerror="this.style.display='none'" />
          <div class="fc-title">
            <div class="fc-name">${item.name || 'Без названия'}</div>
            <div class="fc-meta">
              <span class="fc-quality ${item.quality?.startsWith('epic') ? 'epic-label' : ''}">${qualityLabel}</span>
              ${level ? `<span class="fc-level">Ур. ${level}</span>` : ''}
              <span class="fc-quality">· ${slotLabel}</span>
            </div>
          </div>
        </div>

        ${damageMin || damageMax ? `
          <div class="fc-damage">
            <span class="damage-label">${getDamageLabel(item.slot)}</span>
            ${damageMin}${damageMax ? ` — ${damageMax}` : ''}
          </div>
        ` : ''}

        ${stats.length ? `
          <div class="fc-stats">
            ${stats.map(s => `
              <div class="stat">
                <span class="stat-label">${s.label || s}</span>
                <span class="stat-value">${s.value || ''}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${!isWeapon && setBonus.name ? `
          <div class="fc-set-bonus">
            <div class="set-name">${setBonus.name}</div>
            <div class="set-pieces">
              ${setBonus.piece2 ? `<div class="set-piece"><span class="pieces-label">(2):</span>${setBonus.piece2}</div>` : ''}
              ${setBonus.piece4 ? `<div class="set-piece"><span class="pieces-label">(4):</span>${setBonus.piece4}</div>` : ''}
            </div>
          </div>
        ` : ''}

        ${isWeapon && (effect.name || effect.desc) ? `
          <div class="fc-effect">
            ${effect.image ? `<img class="effect-icon" src="${effect.image}" alt="effect" />` : ''}
            <div class="effect-info">
              ${effect.name ? `<div class="effect-name">${effect.name}</div>` : ''}
              ${effect.desc ? `<div class="effect-desc">${effect.desc}</div>` : ''}
            </div>
          </div>
        ` : ''}

        ${properties.length ? `
          <div class="fc-properties">
            <div class="prop-label">Возможные свойства</div>
            <div class="prop-list">
              ${properties.map(p => `<span class="prop-tag">${p}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        ${desc ? `<div class="fc-flavor">${desc}</div>` : ''}

        <div class="fc-boss">
          ${bossIcon
            ? `<img class="boss-icon" src="${bossIcon}" alt="${bossName}" onerror="this.style.display='none'" />`
            : `<span style="font-size:1.2rem;">👹</span>`}
          <span class="boss-name">${bossName}</span>
        </div>
      </div>
    `;

    return card;
  }

  // ── Загрузка картинки предмета ────────────────────
  document.getElementById('upload-area').addEventListener('click', async () => {
    const file = await pickFile();
    if (!file) return;
    const base64 = await compressImage(file);
    currentImageBase64 = base64;
    const preview = document.getElementById('img-preview');
    preview.src = base64;
    preview.classList.remove('hidden');
    document.getElementById('upload-hint').style.display = 'none';
  });

  // ── Модалка ───────────────────────────────────────
  const modal      = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const editId     = document.getElementById('edit-id');

  function resetForm() {
    editId.value = '';
    currentImageBase64 = null;
    currentEffectImage = null;
    ['f-name','f-description','f-level','f-damage-min','f-damage-max',
     'f-effect-name','f-effect-desc','f-set-name','f-set-2','f-set-4'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('f-boss').value = '';
    document.getElementById('f-slot').value = '';
    document.getElementById('f-quality').value = 'epic';
    document.getElementById('f-weapon-type').value = '';
    setBonusToggle.checked = false;
    setBonusFields.classList.remove('visible');

    effectSection.style.display   = 'block';
    setBonusSection.style.display  = 'none';
    weaponTypeGroup.style.display  = 'block';
    damageMinGroup.style.display   = 'block';
    damageMaxGroup.style.display   = 'block';
    damageMinLabel.textContent = 'Урон (мин)';
    damageMaxLabel.textContent = 'Урон (макс)';

    document.getElementById('stats-fields').innerHTML = '';
    document.getElementById('properties-fields').innerHTML = '';

    const preview = document.getElementById('img-preview');
    preview.classList.add('hidden');
    preview.src = '';
    document.getElementById('upload-hint').style.display = '';

    const effectPreview = document.getElementById('effect-preview');
    effectPreview.classList.add('hidden');
    effectPreview.src = '';
    document.getElementById('effect-upload-hint').style.display = '';

    hideError();
  }

  window.openEdit = (id) => {
    const item = allItems.find(i => i.id === id);
    if (!item) return;

    resetForm();
    modalTitle.textContent = 'Редактировать предмет';
    editId.value = id;

    const slotId = item.slot || '';
    updateFieldsBySlot(slotId);

    document.getElementById('f-slot').value        = slotId;
    document.getElementById('f-name').value        = item.name || '';
    document.getElementById('f-boss').value        = item.boss_id || '';
    document.getElementById('f-description').value = item.description || '';
    document.getElementById('f-quality').value     = item.quality || 'epic';
    document.getElementById('f-level').value       = item.level || '';
    document.getElementById('f-damage-min').value  = item.damage_min || '';
    document.getElementById('f-damage-max').value  = item.damage_max || '';
    document.getElementById('f-weapon-type').value = item.weapon_type || '';

    if (item.effect) {
      document.getElementById('f-effect-name').value = item.effect.name || '';
      document.getElementById('f-effect-desc').value = item.effect.desc || '';
      if (item.effect.image) {
        currentEffectImage = item.effect.image;
        const ep = document.getElementById('effect-preview');
        ep.src = item.effect.image;
        ep.classList.remove('hidden');
        document.getElementById('effect-upload-hint').style.display = 'none';
      }
    }

    if (item.set_bonus) {
      document.getElementById('f-set-name').value = item.set_bonus.name  || '';
      document.getElementById('f-set-2').value    = item.set_bonus.piece2 || '';
      document.getElementById('f-set-4').value    = item.set_bonus.piece4 || '';
      if (item.set_bonus.name || item.set_bonus.piece2 || item.set_bonus.piece4) {
        setBonusToggle.checked = true;
        setBonusFields.classList.add('visible');
      }
    }

    if (item.stats?.length)      setFields('stats-fields', item.stats, 'pair');
    if (item.properties?.length) setFields('properties-fields', item.properties, 'single');

    if (item.image) {
      currentImageBase64 = item.image;
      const preview = document.getElementById('img-preview');
      preview.src = item.image;
      preview.classList.remove('hidden');
      document.getElementById('upload-hint').style.display = 'none';
    }

    modal.classList.remove('hidden');
  };

  function openAdd() {
    resetForm();
    modalTitle.textContent = 'Добавить предмет';
    modal.classList.remove('hidden');
  }

  function closeModal() {
    modal.classList.add('hidden');
    resetForm();
  }

  document.getElementById('btn-modal-close').onclick = closeModal;
  document.getElementById('btn-cancel').onclick      = closeModal;

  // ── Сохранение ────────────────────────────────────
  document.getElementById('btn-save').onclick = async () => {
    const name        = document.getElementById('f-name').value.trim();
    const slot        = document.getElementById('f-slot').value;
    const bossId      = document.getElementById('f-boss').value;
    const description = document.getElementById('f-description').value.trim();
    const quality     = document.getElementById('f-quality').value;
    const level       = document.getElementById('f-level').value.trim();
    const damageMin   = document.getElementById('f-damage-min').value.trim();
    const damageMax   = document.getElementById('f-damage-max').value.trim();
    const effectName  = document.getElementById('f-effect-name').value.trim();
    const effectDesc  = document.getElementById('f-effect-desc').value.trim();
    const setBonusEnabled = setBonusToggle.checked;
    const setName     = document.getElementById('f-set-name').value.trim();
    const set2        = document.getElementById('f-set-2').value.trim();
    const set4        = document.getElementById('f-set-4').value.trim();

    if (!name)   return showError('Введи название');
    if (!slot)   return showError('Выбери слот');
    if (!bossId) return showError('Выбери босса');

    const weaponType = document.getElementById('f-weapon-type').value || null;
    const boss       = allBosses.find(b => b.id === bossId);
    const bossName   = boss?.name || '';

    const stats      = getFields('stats-fields', 'pair');
    const properties = getFields('properties-fields', 'single');

    const effect = {};
    if (effectName || effectDesc || currentEffectImage) {
      effect.name = effectName;
      effect.desc = effectDesc;
      if (currentEffectImage) effect.image = currentEffectImage;
    }

    const setBonus = {};
    if (setBonusEnabled && (setName || set2 || set4)) {
      setBonus.name = setName;
      if (set2) setBonus.piece2 = set2;
      if (set4) setBonus.piece4 = set4;
    }

    const data = {
      name, slot, quality, level,
      damage_min:  damageMin || null,
      damage_max:  damageMax || null,
      boss_id:     bossId,
      boss_name:   bossName,
      description, stats,
      effect:      slot === 'weapon' ? effect : {},
      set_bonus:   slot !== 'weapon' ? setBonus : {},
      properties,
      image:       currentImageBase64 || null,
      weapon_type: weaponType
    };

    const btn = document.getElementById('btn-save');
    btn.disabled    = true;
    btn.textContent = 'Сохранение...';

    try {
      const id = editId.value;
      if (id) {
        await updateItem(id, data);
        showToast('Предмет обновлён');
      } else {
        await addItem(data);
        showToast('Предмет добавлен');
      }
      closeModal();
      await loadItems();
    } catch (error) {
      console.error('Ошибка сохранения:', error);
      showError('Ошибка: ' + error.message);
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Сохранить';
    }
  };

  // ── Удаление ──────────────────────────────────────
  window.confirmDelete = (id, name) => {
    if (!confirm(`Удалить «${name}»?`)) return;
    deleteItem(id)
      .then(() => {
        showToast('Предмет удалён');
        loadItems();
      })
      .catch(error => {
        console.error('Ошибка удаления:', error);
        showToast('Ошибка удаления', 'error');
      });
  };

  // ── Фильтры ───────────────────────────────────────
  document.getElementById('filter-search').addEventListener('input', renderItems);
  document.getElementById('filter-slot').addEventListener('change', renderItems);
  document.getElementById('filter-quality').addEventListener('change', renderItems);
  document.getElementById('filter-boss').addEventListener('change', renderItems);

  // ── Утилиты ───────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('modal-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('modal-error').style.display = 'none';
  }

  function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  await loadBosses();
  await loadItems();
</script>

</body>
</html>
