<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Предметы — TL Loot</title>

  <link rel="stylesheet" href="../css/main.css" />

  <style>
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      transition: border-color 0.15s;
    }

    .item-card:hover {
      border-color: var(--accent);
    }

    .item-card.quality-purple {
      border-left: 3px solid #9b59b6;
    }

    .item-img {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--bg-card2);
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .item-boss {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .item-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 6px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .badge-secondary {
      background: var(--bg-card2);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .modal-header h3 {
      font-size: 1.1rem;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }

    .btn-close:hover {
      color: var(--text);
    }

    .image-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .image-upload-area:hover {
      border-color: var(--accent);
    }

    .image-preview {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 6px;
      margin: 0 auto 0.5rem;
      display: block;
    }

    .upload-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-bar input {
      max-width: 220px;
    }

    .filter-bar select {
      width: auto;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<nav class="navbar" id="main-nav"></nav>

<main class="container">

  <div class="page-header">
    <h2>🗡️ Предметы</h2>
    <button
      class="btn btn-primary hidden"
      data-role="moderator"
      id="btn-add-item"
    >
      + Добавить предмет
    </button>
  </div>

  <div class="filter-bar">
    <input
      type="text"
      id="filter-search"
      placeholder="Поиск по названию..."
    />
    <select id="filter-slot">
      <option value="">Все слоты</option>
    </select>
    <select id="filter-boss">
      <option value="">Все боссы</option>
    </select>
  </div>

  <div id="items-grid" class="items-grid">
    <div class="text-muted">Загрузка...</div>
  </div>

</main>

<!-- Модальное окно -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Добавить предмет</h3>
      <button class="btn-close" id="btn-modal-close">✕</button>
    </div>

    <input type="hidden" id="edit-id" />

    <div class="form-group">
      <label>Картинка</label>
      <div class="image-upload-area" id="upload-area">
        <img id="img-preview" class="image-preview hidden" alt="preview" />
        <div class="upload-hint" id="upload-hint">
          Нажми чтобы выбрать картинку
          <br>
          <small>Сожмётся до 128×128</small>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Название *</label>
      <input type="text" id="f-name" placeholder="Шлем Тени" />
    </div>

    <div class="form-group">
      <label>Слот *</label>
      <select id="f-slot">
        <option value="">— выбери слот —</option>
      </select>
    </div>

    <div class="form-group" id="weapon-type-group" style="display:none;">
      <label>Тип оружия *</label>
      <select id="f-weapon-type">
        <option value="">— выбери тип оружия —</option>
        <option value="bow">🏹 Лук</option>
        <option value="staff">🪄 Посох</option>
        <option value="twohand_sword">⚔️ Двуручный меч</option>
        <option value="crossbow">🎯 Арбалеты</option>
        <option value="wand">✨ Жезл</option>
        <option value="daggers">🗡️ Кинжалы</option>
        <option value="sword_shield">🛡️ Щит и меч</option>
        <option value="spear">🔱 Копье</option>
      </select>
    </div>

    <div class="form-group">
      <label>Качество</label>
      <select id="f-quality">
        <option value="purple">🟣 Эпическое</option>
      </select>
    </div>

    <div class="form-group">
      <label>Босс *</label>
      <select id="f-boss">
        <option value="">— выбери босса —</option>
      </select>
    </div>

    <div class="form-group">
      <label>Описание</label>
      <textarea id="f-description" rows="3" placeholder="Характеристики, особенности..."></textarea>
    </div>

    <div id="modal-error" class="text-danger mt-1" style="display:none; font-size:0.85rem;"></div>

    <div class="flex gap-1 mt-3">
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
      <button class="btn btn-ghost" id="btn-cancel">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
  // ==================================================
  // ИМПОРТЫ
  // ==================================================

  import { initNavbar } from "../js/modules/navbar.js";
  import { 
    initAuth, 
    authReady, 
    canWrite, 
    currentRole,
    currentUser 
  } from "../js/modules/auth.js";

  import {
    getItems,
    addItem,
    updateItem,
    deleteItem
  } from "../js/modules/items.js";

  import {
    compressImage,
    pickFile,
    setItemImage
  } from "../js/modules/images.js";

  import { SLOTS } from "../js/constants.js";

  // Прямой запрос к Firestore (вместо bosses.js)
  import { 
    collection, 
    getDocs, 
    query, 
    orderBy 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { db } from "../js/firebase.js";


  // ==================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ==================================================

  initNavbar();
  initAuth();
  await authReady;

  console.log('🔐 Авторизация на странице предметов:', {
    user: currentUser?.email || 'Нет',
    role: currentRole,
    canWrite: canWrite()
  });

  const addBtn = document.getElementById('btn-add-item');
  if (addBtn) {
    addBtn.classList.toggle('hidden', !canWrite());
  }


  // ==================================================
  // SELECT СЛОТОВ
  // ==================================================

  const slotSelect = document.getElementById("f-slot");
  const filterSlot = document.getElementById("filter-slot");

  SLOTS.forEach(slot => {
    slotSelect.innerHTML += `
      <option value="${slot.id}">${slot.label}</option>
    `;
    filterSlot.innerHTML += `
      <option value="${slot.id}">${slot.label}</option>
    `;
  });


  // ==================================================
  // ЗАГРУЗКА БОССОВ (прямой запрос)
  // ==================================================

  let allBosses = [];

  async function loadBosses() {
    try {
      const bossesRef = collection(db, 'bosses');
      const q = query(bossesRef, orderBy('name'));
      const querySnapshot = await getDocs(q);
      allBosses = querySnapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      populateBossSelects();
    } catch (error) {
      console.error('Ошибка загрузки боссов:', error);
      allBosses = [];
    }
  }

  function populateBossSelects() {
    const bossSelect = document.getElementById('f-boss');
    const filterBoss = document.getElementById('filter-boss');

    const currentValue = bossSelect.value;
    const filterValue = filterBoss.value;

    bossSelect.innerHTML = `<option value="">— выбери босса —</option>`;
    filterBoss.innerHTML = `<option value="">Все боссы</option>`;

    allBosses.forEach(boss => {
      bossSelect.innerHTML += `
        <option value="${boss.id}">${boss.name}</option>
      `;
      filterBoss.innerHTML += `
        <option value="${boss.id}">${boss.name}</option>
      `;
    });

    if (currentValue) bossSelect.value = currentValue;
    if (filterValue) filterBoss.value = filterValue;
  }


  // ==================================================
  // ПОКАЗ / СКРЫТИЕ ТИПА ОРУЖИЯ
  // ==================================================

  const weaponTypeGroup = document.getElementById('weapon-type-group');
  const weaponTypeSelect = document.getElementById('f-weapon-type');

  slotSelect.addEventListener('change', function() {
    if (this.value === 'weapon') {
      weaponTypeGroup.style.display = 'block';
    } else {
      weaponTypeGroup.style.display = 'none';
      weaponTypeSelect.value = '';
    }
  });


  // ==================================================
  // СОСТОЯНИЕ
  // ==================================================

  let allItems = [];
  let currentImageBase64 = null;


  // ==================================================
  // ЗАГРУЗКА ПРЕДМЕТОВ
  // ==================================================

  async function loadItems() {
    try {
      allItems = await getItems();
      populateBossFilter();
      renderItems();
    } catch (error) {
      console.error("Ошибка загрузки предметов:", error);
      document.getElementById("items-grid").innerHTML = `
        <div class="text-danger">Не удалось загрузить предметы</div>
      `;
    }
  }


  // ==================================================
  // ФИЛЬТР БОССОВ
  // ==================================================

  function populateBossFilter() {
    const bossIds = [...new Set(allItems.map(item => item.boss_id).filter(Boolean))];
    const bossNames = [];
    bossIds.forEach(id => {
      const boss = allBosses.find(b => b.id === id);
      if (boss) bossNames.push({ id: boss.id, name: boss.name });
    });
    bossNames.sort((a, b) => a.name.localeCompare(b.name));

    const select = document.getElementById("filter-boss");
    const currentValue = select.value;
    select.innerHTML = `<option value="">Все боссы</option>`;
    bossNames.forEach(boss => {
      select.innerHTML += `<option value="${boss.id}">${boss.name}</option>`;
    });
    if (currentValue) select.value = currentValue;
  }


  // ==================================================
  // ОТОБРАЖЕНИЕ
  // ==================================================

  function renderItems() {
    const search = document.getElementById("filter-search").value.toLowerCase();
    const slot = document.getElementById("filter-slot").value;
    const bossId = document.getElementById("filter-boss").value;

    const list = allItems.filter(item => {
      if (search && !item.name?.toLowerCase().includes(search) && !item.boss_name?.toLowerCase().includes(search)) return false;
      if (slot && item.slot !== slot) return false;
      if (bossId && item.boss_id !== bossId) return false;
      return true;
    });

    const grid = document.getElementById("items-grid");
    if (!list.length) {
      grid.innerHTML = `<div class="text-muted">Предметов не найдено</div>`;
      return;
    }

    grid.innerHTML = "";
    list.forEach(item => grid.appendChild(buildCard(item)));
  }


  // ==================================================
  // КАРТОЧКА ПРЕДМЕТА
  // ==================================================

  function getWeaponTypeLabel(type) {
    const types = {
      'bow': '🏹 Лук',
      'staff': '🪄 Посох',
      'twohand_sword': '⚔️ Двуручный меч',
      'crossbow': '🎯 Арбалеты',
      'wand': '✨ Жезл',
      'daggers': '🗡️ Кинжалы',
      'sword_shield': '🛡️ Щит и меч',
      'spear': '🔱 Копье'
    };
    return types[type] || type;
  }

  function getBossName(bossId) {
    const boss = allBosses.find(b => b.id === bossId);
    return boss?.name || '—';
  }

  function buildCard(item) {
    const slotLabel = SLOTS.find(slot => slot.id === item.slot)?.label || item.slot;
    const canEdit = canWrite();

    const card = document.createElement("div");
    card.className = `item-card quality-${item.quality || "purple"}`;
    card.innerHTML = `
      <img class="item-img" id="img-${item.id}" alt="${item.name || "Предмет"}" />
      <div class="item-info">
        <div class="item-name">${item.name || "Без названия"}</div>
        <div class="item-meta">
          <span class="badge badge-purple">${slotLabel}</span>
          ${item.slot === 'weapon' && item.weapon_type ? `
            <span class="badge-secondary">${getWeaponTypeLabel(item.weapon_type)}</span>
          ` : ''}
        </div>
        <div class="item-boss">👹 ${getBossName(item.boss_id)}</div>
        ${item.description ? `<div class="item-desc">${item.description}</div>` : ""}
      </div>
      ${canEdit ? `
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${item.id}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete('${item.id}','${String(item.name || "").replace(/'/g, "\\'")}')">🗑️</button>
        </div>
      ` : ""}
    `;

    const image = card.querySelector(`#img-${item.id}`);
    setItemImage(image, item.image);
    return card;
  }


  // ==================================================
  // ЗАГРУЗКА КАРТИНКИ
  // ==================================================

  document.getElementById("upload-area").addEventListener("click", async () => {
    const file = await pickFile();
    if (!file) return;
    const base64 = await compressImage(file);
    currentImageBase64 = base64;
    const preview = document.getElementById("img-preview");
    preview.src = base64;
    preview.classList.remove("hidden");
    document.getElementById("upload-hint").style.display = "none";
  });


  // ==================================================
  // MODAL
  // ==================================================

  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modal-title");
  const editId = document.getElementById("edit-id");

  function resetForm() {
    editId.value = "";
    currentImageBase64 = null;
    document.getElementById("f-name").value = "";
    document.getElementById("f-boss").value = "";
    document.getElementById("f-description").value = "";
    document.getElementById("f-slot").value = "";
    document.getElementById("f-quality").value = "purple";
    document.getElementById("f-weapon-type").value = "";
    weaponTypeGroup.style.display = 'none';
    const preview = document.getElementById("img-preview");
    preview.classList.add("hidden");
    preview.src = "";
    document.getElementById("upload-hint").style.display = "";
    hideError();
  }

  window.openEdit = (id) => {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    resetForm();
    modalTitle.textContent = "Редактировать предмет";
    editId.value = id;
    document.getElementById("f-name").value = item.name || "";
    document.getElementById("f-slot").value = item.slot || "";
    document.getElementById("f-boss").value = item.boss_id || "";
    document.getElementById("f-description").value = item.description || "";
    document.getElementById("f-quality").value = item.quality || "purple";
    if (item.slot === 'weapon') {
      weaponTypeGroup.style.display = 'block';
      document.getElementById("f-weapon-type").value = item.weapon_type || '';
    }
    if (item.image) {
      currentImageBase64 = item.image;
      const preview = document.getElementById("img-preview");
      preview.src = item.image;
      preview.classList.remove("hidden");
      document.getElementById("upload-hint").style.display = "none";
    }
    modal.classList.remove("hidden");
  };

  function openAdd() {
    resetForm();
    modalTitle.textContent = "Добавить предмет";
    modal.classList.remove("hidden");
  }

  function closeModal() {
    modal.classList.add("hidden");
    resetForm();
  }

  document.getElementById("btn-modal-close").onclick = closeModal;
  document.getElementById("btn-cancel").onclick = closeModal;
  document.getElementById("btn-add-item").onclick = openAdd;


  // ==================================================
  // СОХРАНЕНИЕ
  // ==================================================

  document.getElementById("btn-save").onclick = async () => {
    const name = document.getElementById("f-name").value.trim();
    const slot = document.getElementById("f-slot").value;
    const bossId = document.getElementById("f-boss").value;
    const description = document.getElementById("f-description").value.trim();
    const quality = document.getElementById("f-quality").value;

    if (!name) return showError("Введи название");
    if (!slot) return showError("Выбери слот");

    let weaponType = null;
    if (slot === 'weapon') {
      weaponType = document.getElementById("f-weapon-type").value;
      if (!weaponType) return showError("Выбери тип оружия");
    }
    if (!bossId) return showError("Выбери босса");

    const boss = allBosses.find(b => b.id === bossId);
    const bossName = boss?.name || '';

    const btn = document.getElementById("btn-save");
    btn.disabled = true;
    btn.textContent = "Сохранение...";

    try {
      const data = { name, slot, quality, boss_id: bossId, boss_name: bossName, description, image: currentImageBase64 || null, weapon_type: weaponType };
      const id = editId.value;
      if (id) {
        await updateItem(id, data);
        showToast("Предмет обновлён");
      } else {
        await addItem(data);
        showToast("Предмет добавлен");
      }
      closeModal();
      await loadItems();
    } catch (error) {
      console.error("Ошибка сохранения:", error);
      showError("Ошибка: " + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Сохранить";
    }
  };


  // ==================================================
  // УДАЛЕНИЕ
  // ==================================================

  window.confirmDelete = (id, name) => {
    if (!confirm(`Удалить «${name}»?`)) return;
    deleteItem(id)
      .then(() => {
        showToast("Предмет удалён");
        loadItems();
      })
      .catch(error => {
        console.error("Ошибка удаления:", error);
        showToast("Ошибка удаления", "error");
      });
  };


  // ==================================================
  // ФИЛЬТРЫ
  // ==================================================

  document.getElementById("filter-search").addEventListener("input", renderItems);
  document.getElementById("filter-slot").addEventListener("change", renderItems);
  document.getElementById("filter-boss").addEventListener("change", renderItems);


  // ==================================================
  // HELPERS
  // ==================================================

  function showError(msg) {
    const el = document.getElementById("modal-error");
    el.textContent = msg;
    el.style.display = "block";
  }

  function hideError() {
    document.getElementById("modal-error").style.display = "none";
  }

  function showToast(msg, type = "success") {
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }


  // ==================================================
  // INIT
  // ==================================================

  await loadBosses();
  await loadItems();

</script>

</body>
</html>
