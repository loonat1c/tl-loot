<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — TL Loot</title>

  <link rel="stylesheet" href="../css/main.css" />

  <style>
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .auth-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-container .form-group {
      margin-bottom: 1rem;
    }

    .auth-container .btn {
      width: 100%;
      margin-top: 0.5rem;
    }

    .auth-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-link a {
      color: var(--accent);
      text-decoration: none;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .success-message {
      color: #2ecc71;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .password-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
  </style>
</head>

<body>

<!-- ═══════════════════════════════════════════
     НАВБАР
═══════════════════════════════════════════ -->

<nav class="navbar" id="main-nav"></nav>


<!-- ═══════════════════════════════════════════
     ФОРМА РЕГИСТРАЦИИ
═══════════════════════════════════════════ -->

<main class="container">

  <div class="auth-container">

    <h2>🔐 Создать аккаунт</h2>

    <form id="register-form" autocomplete="off">

      <!-- Email -->
      <div class="form-group">
        <label for="reg-email">Email *</label>
        <input
          type="email"
          id="reg-email"
          placeholder="your@email.com"
          required
        />
      </div>

      <!-- Пароль -->
      <div class="form-group">
        <label for="reg-password">Пароль *</label>
        <input
          type="password"
          id="reg-password"
          placeholder="Минимум 6 символов"
          minlength="6"
          required
        />
        <div class="password-hint">
          Пароль должен содержать минимум 6 символов
        </div>
      </div>

      <!-- Подтверждение пароля -->
      <div class="form-group">
        <label for="reg-password-confirm">Подтвердите пароль *</label>
        <input
          type="password"
          id="reg-password-confirm"
          placeholder="Повторите пароль"
          required
        />
      </div>

      <!-- Имя пользователя (опционально) -->
      <div class="form-group">
        <label for="reg-username">Имя пользователя</label>
        <input
          type="text"
          id="reg-username"
          placeholder="Как к вам обращаться"
        />
      </div>

      <!-- Сообщения -->
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <!-- Кнопка -->
      <button type="submit" class="btn btn-primary" id="btn-register">
        Зарегистрироваться
      </button>

    </form>

    <div class="auth-link">
      Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>

  </div>

</main>


<!-- ═══════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════ -->

<script type="module">
  import { initNavbar } from "../js/modules/navbar.js";
  import { 
    initAuth, 
    authReady, 
    register,
    currentUser 
  } from "../js/modules/auth.js";

  // Инициализация
  initNavbar();
  initAuth();

  // Если уже авторизован — перенаправить на главную
  await authReady;
  if (currentUser) {
    window.location.href = "index.html";
  }

  const form = document.getElementById('register-form');
  const emailInput = document.getElementById('reg-email');
  const passwordInput = document.getElementById('reg-password');
  const passwordConfirmInput = document.getElementById('reg-password-confirm');
  const usernameInput = document.getElementById('reg-username');
  const errorDiv = document.getElementById('error-message');
  const successDiv = document.getElementById('success-message');
  const btnRegister = document.getElementById('btn-register');

  // Скрываем сообщения при вводе
  [emailInput, passwordInput, passwordConfirmInput, usernameInput].forEach(input => {
    input.addEventListener('input', () => {
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Сброс сообщений
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const passwordConfirm = passwordConfirmInput.value;
    const username = usernameInput.value.trim();

    // Валидация
    if (!email) {
      errorDiv.textContent = 'Введите email';
      errorDiv.style.display = 'block';
      return;
    }

    if (!password) {
      errorDiv.textContent = 'Введите пароль';
      errorDiv.style.display = 'block';
      return;
    }

    if (password.length < 6) {
      errorDiv.textContent = 'Пароль должен содержать минимум 6 символов';
      errorDiv.style.display = 'block';
      return;
    }

    if (password !== passwordConfirm) {
      errorDiv.textContent = 'Пароли не совпадают';
      errorDiv.style.display = 'block';
      return;
    }

    // Блокируем кнопку
    btnRegister.disabled = true;
    btnRegister.textContent = 'Регистрация...';

    try {
      const result = await register(email, password, username || null);
      
      if (result.success) {
        successDiv.textContent = '✅ Регистрация успешна! Перенаправление...';
        successDiv.style.display = 'block';
        
        // Перенаправление через 2 секунды
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } else {
        errorDiv.textContent = result.error || 'Ошибка регистрации';
        errorDiv.style.display = 'block';
      }
    } catch (error) {
      errorDiv.textContent = error.message || 'Произошла ошибка';
      errorDiv.style.display = 'block';
    } finally {
      btnRegister.disabled = false;
      btnRegister.textContent = 'Зарегистрироваться';
    }
  });

</script>

</body>
</html>
