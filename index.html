<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TL Loot — Гильдейский трекер</title>
  <link rel="stylesheet" href="css/main.css" />

  <style>
    /* Дополнительные стили для главной страницы */
    .hero {
      text-align: center;
      padding: 3rem 0 2rem;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .card-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1rem;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }

    .card-link:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .card-link .icon {
      font-size: 2rem;
    }

    .card-link strong {
      font-size: 1rem;
    }

    .card-link small {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem auto;
      max-width: 600px;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item .number {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-soft);
    }

    .stat-item .label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 1.8rem;
      }

      .quick-links {
        grid-template-columns: 1fr;
      }

      .stats-row {
        gap: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- ═══════════════ НАВБАР ═══════════════ -->
  <nav class="navbar" id="main-nav"></nav>

  <!-- ═══════════════ ГЛАВНАЯ ═══════════════ -->
  <main class="container">
    <section class="hero">
      <h1>🗡️ Трекер лута гильдии</h1>
      <p class="hero-sub">Throne &amp; Liberty — справедливое распределение через прозрачные логи</p>

      <div class="quick-links">
        <a href="pages/raids.html" class="card-link">
          <span class="icon">🗡️</span>
          <strong>Рейды</strong>
          <small>История и новый рейд</small>
        </a>
        <a href="pages/players.html" class="card-link">
          <span class="icon">👥</span>
          <strong>Игроки</strong>
          <small>Профили и блокировки</small>
        </a>
        <a href="pages/search.html" class="card-link">
          <span class="icon">🔍</span>
          <strong>Поиск</strong>
          <small>Игрок, босс, шмотка</small>
        </a>
        <a href="pages/stats.html" class="card-link">
          <span class="icon">📊</span>
          <strong>Статистика</strong>
          <small>Лут в люцентах</small>
        </a>
      </div>
    </section>

    <hr class="divider" />

    <!-- Статистика -->
    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="number" id="stat-items">0</div>
        <div class="label">Всего предметов</div>
      </div>
      <div class="stat-item">
        <div class="number" id="stat-players">0</div>
        <div class="label">Игроков</div>
      </div>
      <div class="stat-item">
        <div class="number" id="stat-bosses">0</div>
        <div class="label">Боссов</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initNavbar } from "./js/modules/navbar.js";
    import { initAuth, authReady, currentUser, currentRole } from "./js/modules/auth.js";
    import { getItems } from "./js/modules/items.js";

    // Инициализация
    initNavbar();
    initAuth();

    // Ждём авторизацию и загружаем статистику
    await authReady;

    try {
      const items = await getItems();
      const bosses = new Set(items.map(i => i.boss_name).filter(Boolean));
      
      document.getElementById('stat-items').textContent = items.length;
      document.getElementById('stat-bosses').textContent = bosses.size;
      
      // Показываем примерное количество игроков
      // В реальном проекте нужно загружать из отдельной коллекции
      document.getElementById('stat-players').textContent = '0';
    } catch (error) {
      console.error('Ошибка загрузки статистики:', error);
    }

    console.log('🔐 Текущий пользователь:', currentUser?.email || 'Гость');
    console.log('🔐 Роль:', currentRole);
  </script>
</body>
</html>
