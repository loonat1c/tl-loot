<script type="module">
    import { initNavbar } from "./js/modules/navbar.js";
    import { initAuth, authReady } from "./js/modules/auth.js";
    import { db } from "./js/firebase.js";
    import {
      collection, getDocs, query, orderBy, limit,
      where, collectionGroup
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initNavbar();
    initAuth();
    await authReady;

    // ──────────────────────────────────────────────
    // Форматирование чисел
    // ──────────────────────────────────────────────
    function fmt(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1_000)     return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
      return String(n);
    }

    function fmtDate(str) {
      if (!str) return '—';
      const d = new Date(str);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // ──────────────────────────────────────────────
    // Загрузка данных
    // ──────────────────────────────────────────────
    try {
      // 1. Получаем активные рейды (не удаленные)
      const raidsSnap = await getDocs(
        query(collection(db, 'raids'), orderBy('date', 'desc'))
      );
      const allRaids = raidsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const activeRaids = allRaids.filter(r => !r.deleted); // Только активные рейды
      const activeRaidIds = new Set(activeRaids.map(r => r.id));

      // 2. loot_history — только для активных рейдов
      const lootSnap = await getDocs(collection(db, 'loot_history'));
      const allLootDocs = lootSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const lootDocs = allLootDocs.filter(d => activeRaidIds.has(d.raid_id)); // Только лут из активных рейдов

      // Предметов выбито
      document.getElementById('stat-items').textContent = fmt(lootDocs.length);
      document.getElementById('stat-items-sub').textContent =
        lootDocs.length === 1 ? '1 дроп записан' : `${lootDocs.length} дропов записано`;

      // Уникальных победителей
      const winners = new Set(lootDocs.map(d => d.player_id).filter(Boolean));
      document.getElementById('stat-winners').textContent = fmt(winners.size);
      document.getElementById('stat-winners-sub').textContent =
        `уникальных игроков с лутом`;

      // Люценты
      const totalLucent = lootDocs.reduce((s, d) => s + (Number(d.lucent_value_snapshot) || 0), 0);
      document.getElementById('stat-lucent').textContent = fmt(totalLucent);
      document.getElementById('stat-lucent-sub').textContent =
        totalLucent > 0 ? 'суммарная стоимость' : 'данные обновляются';

      // 3. Считаем траи только для активных рейдов
      let totalTries = 0;
      try {
        // Загружаем все tries через collectionGroup
        const triesSnap = await getDocs(collectionGroup(db, 'tries'));
        const triesDocs = triesSnap.docs.map(d => ({
          id: d.id,
          ...d.data(),
          parentRaidId: d.ref.parent.parent?.id // Получаем ID родительского рейда
        }));
        
        // Фильтруем tries по активным рейдам
        totalTries = triesDocs.filter(t => activeRaidIds.has(t.parentRaidId)).length;
      } catch (e) {
        console.warn('CollectionGroup failed, using fallback:', e);
        // Fallback: суммируем drop_count только активных рейдов
        totalTries = activeRaids.reduce((s, r) => s + (Number(r.drop_count) || 0), 0);
      }

      document.getElementById('stat-tries').textContent = fmt(totalTries);
      document.getElementById('stat-tries-sub').textContent =
        `за ${activeRaids.length} рейдов`;

      // 4. Последний активный рейд
      if (activeRaids.length > 0) {
        const last = activeRaids[0]; // Уже отсортированы по дате

        // Название: берём босса из первого loot_history с этим raid_id
        const lastLoot = lootDocs.filter(d => d.raid_id === last.id);
        const bossName = lastLoot[0]?.boss_name || last.boss_name || '—';

        document.getElementById('last-raid-name').textContent =
          bossName !== '—' ? `Рейд · ${bossName}` : 'Последний рейд';

        // Мета
        const meta = document.getElementById('last-raid-meta');
        const statusColor = last.status === 'closed' ? 'var(--text-muted)' : 'var(--success)';
        const statusLabel = last.status === 'closed' ? 'Завершён' : 'Активен';
        meta.innerHTML = `
          <span class="last-raid-meta-item" style="color:${statusColor}">
            ● ${statusLabel}
          </span>
          <span class="last-raid-meta-item">
            <span class="dot"></span>${fmtDate(last.date)}
          </span>
          <span class="last-raid-meta-item">
            <span class="dot"></span>${last.drop_count || 0} дропов
          </span>
          ${last.attended_player_ids ? `<span class="last-raid-meta-item"><span class="dot"></span>${last.attended_player_ids.length} участников</span>` : ''}
        `;

        // Лут
        const lootContainer = document.getElementById('last-raid-loot');

        if (lastLoot.length === 0) {
          lootContainer.innerHTML = `
            <div class="panel-empty">
              <div class="empty-icon">🎁</div>
              <div>Лут-лог пуст</div>
            </div>`;
        } else {
          lootContainer.innerHTML = '';
          lastLoot.forEach(item => {
            const hasImage = item.item_image && item.item_image.length < 100_000; // не слишком большой base64
            const lucentVal = Number(item.lucent_value_snapshot) || 0;
            const slotLabel = item.item_slot || '';

            const row = document.createElement('div');
            row.className = 'loot-item-row';
            row.innerHTML = `
              ${hasImage
                ? `<img class="loot-item-img" src="${item.item_image}" alt="${item.item_name}" loading="lazy" />`
                : `<div class="loot-item-img-placeholder">⚔️</div>`}
              <div class="loot-item-info">
                <div class="loot-item-name">
                  ${item.item_name || 'Предмет'}
                  ${slotLabel ? `<span class="slot-badge">${slotLabel}</span>` : ''}
                </div>
                <div class="loot-item-winner">
                  <span>→</span>
                  <span class="winner-name">${item.player_nickname || '—'}</span>
                  ${item.roll_type ? `<span style="opacity:0.5;font-size:0.65rem;">${item.roll_type}</span>` : ''}
                </div>
              </div>
              <div class="loot-item-lucent ${lucentVal === 0 ? 'zero' : ''}">
                ${lucentVal > 0 ? `💎 ${fmt(lucentVal)}` : '—'}
              </div>
            `;
            lootContainer.appendChild(row);
          });
        }
      } else {
        document.getElementById('last-raid-name').textContent = 'Нет активных рейдов';
        document.getElementById('last-raid-body').innerHTML = `
          <div class="panel-empty">
            <div class="empty-icon">⚔️</div>
            <div>Активные рейды не найдены</div>
          </div>`;
      }

    } catch (err) {
      console.error('❌ Ошибка загрузки статистики:', err);
      ['stat-tries', 'stat-items', 'stat-winners', 'stat-lucent'].forEach(id => {
        document.getElementById(id).textContent = '—';
      });
      ['stat-tries-sub', 'stat-items-sub', 'stat-winners-sub', 'stat-lucent-sub'].forEach(id => {
        document.getElementById(id).textContent = 'ошибка загрузки';
      });
    }
  </script>
